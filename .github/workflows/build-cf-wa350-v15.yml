name: build-cf-wa350-v15
# v15 (2026-11-04) - Pin PR #25040 head to e0b8b37 to eliminate drift
# Rest of the logic (lenient cherry-pick, per-PR snapshots, asset mirroring) unchanged from v14.

on:
  workflow_dispatch:
    inputs:
      asset_profile:
        description: 'Asset profile to import (main/general/special from building-helper)'
        required: true
        default: main
        type: choice
        options: [main, general, special]
      bh_token:
        description: 'Optional GitHub PAT (Contents:Read on building-helper)'
        required: false
        default: ''
        type: string

env:
  BUILDING_HELPER_REPO: https://github.com/haddad2inc/building-helper.git
  UPSTREAM_REPO: https://github.com/openwrt/openwrt.git
  BASE_BRANCH: comfast-cf-wa350-support
  BASE_SHA: e0b8b375e9904f08a5a785eadb5f145d70c38e7f   # <-- pinned head of PR #25040
  BR_25760: generic-leds-wired-rate-activity
  BR_25761: mac80211-tpt-led-delivered-idle
  BR_25474: ath79-mtd-mx25l12805d-restore-name
  BR_25477: ath79-ar8216-internal-mdio
  MAX_RANGE_COMMITS: "20"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      # ---------------------------------------------------------------
      # 1) Checkout base branch at the pinned SHA
      # ---------------------------------------------------------------
      - name: Checkout base branch (PR #25040 head @ e0b8b37)
        uses: actions/checkout@v4
        with:
          repository: haddad2inc/openwrt
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0

      # ---------------------------------------------------------------
      # 2) Fetch upstream master + the five PR branches
      # ---------------------------------------------------------------
      - name: Fetch upstream master + the five PR branches
        run: |
          set -e
          mkdir -p logs pr-sources
          git fetch --quiet "$UPSTREAM_REPO" master
          UPMASTER="$(git rev-parse FETCH_HEAD)"
          git fetch origin main \
            "$BR_25760" \
            "$BR_25761" \
            "$BR_25474" \
            "$BR_25477" \
            "$BASE_BRANCH" \
            ci-wa350 || true
          echo "UPMASTER=$UPMASTER" >> "$GITHUB_ENV"
          echo "UPMASTER=$UPMASTER"
          for b in "$BASE_BRANCH" "$BR_25760" "$BR_25761" "$BR_25474" "$BR_25477"; do
            printf 'HEAD %-40s = %s\n' "$b" "$(git rev-parse origin/$b 2>/dev/null || echo MISSING)"
          done

      # ---------------------------------------------------------------
      # 3) Collect source snapshots per PR (pre-pick)
      # ---------------------------------------------------------------
      - name: Collect source snapshots per PR (pre-pick)
        run: |
          set +e
          collect_pr() {
            local br="$1" label="$2" ref="origin/$1"
            local dir="pr-sources/$label"
            mkdir -p "$dir/files"
            if ! git rev-parse -q --verify "$ref" >/dev/null 2>&1; then
              echo "BRANCH-MISSING: $br" > "$dir/STATUS.txt"
              echo "MISSING $label"
              return 0
            fi
            local UMB N HEAD_SHA
            HEAD_SHA="$(git rev-parse "$ref")"
            UMB="$(git merge-base "$UPMASTER" "$ref")"
            if [ -z "$UMB" ]; then
              printf 'BRANCH: %s\nHEAD: %s\nSTATUS: NO-MERGE-BASE with upstream master\n' \
                "$br" "$HEAD_SHA" > "$dir/STATUS.txt"
              return 0
            fi
            N="$(git rev-list --count "$UMB".."$ref")"
            {
              echo "branch:            $br"
              echo "ref:               $ref"
              echo "head-sha:          $HEAD_SHA"
              echo "upstream-merge-base: $UMB"
              echo "commits-above-base:  $N"
              echo "collected-at:      $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            } > "$dir/STATUS.txt"

            git log --oneline "$UMB".."$ref"       > "$dir/commits.txt"
            git diff --name-status "$UMB".."$ref"  > "$dir/files.txt"
            git diff --stat       "$UMB".."$ref"   > "$dir/files.stat.txt"
            git diff              "$UMB".."$ref"   > "$dir/changes.patch"

            while IFS=$'\t' read -r status f1 f2; do
              [ -z "$status" ] && continue
              case "$status" in
                A|M|T)
                  local target="$dir/files/$f1"
                  mkdir -p "$(dirname "$target")"
                  git show "$ref:$f1" > "$target" 2>/dev/null || echo "COPY-FAILED $f1" >> "$dir/STATUS.txt"
                  ;;
                D)
                  echo "DELETED: $f1" >> "$dir/STATUS.txt"
                  ;;
                R*|C*)
                  local target="$dir/files/$f2"
                  mkdir -p "$(dirname "$target")"
                  git show "$ref:$f2" > "$target" 2>/dev/null || true
                  echo "RENAMED: $f1 -> $f2 ($status)" >> "$dir/STATUS.txt"
                  ;;
              esac
            done < "$dir/files.txt"

            echo "COLLECTED $label: $N commits, $(wc -l < "$dir/files.txt") files"
          }

          collect_pr "$BASE_BRANCH" "PR-25040"
          collect_pr "$BR_25760"    "PR-25760"
          collect_pr "$BR_25761"    "PR-25761"
          collect_pr "$BR_25474"    "PR-25474"
          collect_pr "$BR_25477"    "PR-25477"

          {
            echo "# PR Sources Index (v15)"
            echo
            echo "Generated: $(date -u)"
            echo "Upstream master: $UPMASTER"
            echo "Pinned base SHA: $BASE_SHA"
            echo
            for d in pr-sources/*/; do
              echo "## $d"
              sed 's/^/  /' "$d/STATUS.txt" 2>/dev/null | head -20
              echo
            done
          } > pr-sources/INDEX.md

          cat pr-sources/INDEX.md
          exit 0

      # ---------------------------------------------------------------
      # 4) Lenient cherry-pick of the five PR ranges
      # ---------------------------------------------------------------
      - name: Cherry-pick the five PR ranges (lenient)
        run: |
          set +e
          git config user.name  "haddad2inc"
          git config user.email "haddad2inc@gmail.com"
          : > logs/picks.txt
          BASE_SHA_START="$(git rev-parse HEAD)"

          log() { echo "$1" | tee -a logs/picks.txt; }

          pick() {
            local ref="$1" label="$2" sha out rc
            sha="$(git rev-parse "$ref")" || { log "ERR-CANNOT-RESOLVE $label $ref"; return 1; }
            if git merge-base --is-ancestor "$sha" HEAD; then
              log "ALREADY-IN-BASE $label $sha"; return 0
            fi
            out="$(git cherry-pick -x "$sha" 2>&1)"; rc=$?
            if [ "$rc" -eq 0 ]; then log "PICKED $label $sha"; return 0; fi
            out="$(git cherry-pick -x -X theirs "$sha" 2>&1)"; rc=$?
            if [ "$rc" -eq 0 ]; then log "PICKED-THEIRS $label $sha"; return 0; fi
            git cherry-pick --abort 2>/dev/null || true
            log "PICK-SKIPPED $label $sha (conflict, skipped)"
            return 0
          }

          pr_range() {
            local br="$1" label="$2" max="$3" ref UMB N
            ref="origin/$br"
            git rev-parse -q --verify "$ref" >/dev/null || { log "ERR-NO-BRANCH $label $br"; return 0; }
            UMB="$(git merge-base "$UPMASTER" "$ref")" || { log "ERR-MERGE-BASE $label"; return 0; }
            N="$(git rev-list --count "$UMB".."$ref")"
            log "$label-RANGE commits=$N max=$max"
            if [ "$N" -lt 1 ]; then log "$label-RANGE-EMPTY: skipping"; return 0; fi
            if [ "$N" -gt "$max" ]; then log "::warning::$label-RANGE-TOO-LARGE: $N > $max"; fi
            for c in $(git rev-list --reverse "$UMB".."$ref"); do
              pick "$c" "$label-$(git log -1 --format=%h "$c")"
            done
          }

          pr_range "$BASE_BRANCH" PR-25040 "$MAX_RANGE_COMMITS"
          pr_range "$BR_25760"    PR-25760 "$MAX_RANGE_COMMITS"
          pr_range "$BR_25761"    PR-25761 "$MAX_RANGE_COMMITS"
          pr_range "$BR_25474"    PR-25474 "$MAX_RANGE_COMMITS"
          pr_range "$BR_25477"    PR-25477 "$MAX_RANGE_COMMITS"

          log "CONTENT-GATES-DISABLED (tolerance mode v15)"
          git log --oneline "$BASE_SHA_START..HEAD" | tee -a logs/picks.txt
          exit 0

      # ---------------------------------------------------------------
      # 5) .config from ci-wa350
      # ---------------------------------------------------------------
      - name: Pull .config asset from ci-wa350
        run: |
          set +e
          git fetch --depth 1 origin ci-wa350 || { echo "::error::fetch ci-wa350 failed"; exit 1; }
          mkdir -p /tmp/assets pr-sources/assets-incoming
          git show origin/ci-wa350:.config > /tmp/assets/.config 2>/dev/null \
            || { echo "::error::.config not found in ci-wa350"; exit 1; }
          cp /tmp/assets/.config pr-sources/assets-incoming/.config
          echo "ci-wa350 .config -> /tmp/assets/.config ($(wc -l < /tmp/assets/.config) lines)"
          exit 0

      # ---------------------------------------------------------------
      # 6) Import assets from building-helper
      # ---------------------------------------------------------------
      - name: Import assets from building-helper (profile-driven)
        env:
          BH_TOKEN: ${{ inputs.bh_token }}
        run: |
          set +e
          PROFILE="${{ inputs.asset_profile }}"
          case "$PROFILE" in
            main)    BH_PATH="m" ;;
            general) BH_PATH="g" ;;
            special) BH_PATH="s" ;;
            *) echo "::error::invalid profile '$PROFILE'"; exit 1 ;;
          esac

          if [ -n "$BH_TOKEN" ]; then
            URL="https://x-access-token:$BH_TOKEN@github.com/haddad2inc/building-helper.git"
          else
            URL="$BUILDING_HELPER_REPO"
          fi

          rm -rf /tmp/bh
          if ! git clone --depth 1 "$URL" /tmp/bh; then
            echo "::warning::building-helper clone failed — continuing without assets"
            exit 0
          fi

          if [ -d "/tmp/bh/$BH_PATH" ]; then
            mkdir -p pr-sources/assets
            cp -a "/tmp/bh/$BH_PATH/." pr-sources/assets/
            echo "Imported /tmp/bh/$BH_PATH -> pr-sources/assets/"
            find pr-sources/assets -maxdepth 2 -type f | head -40
          else
            echo "::warning::no '$BH_PATH' folder in building-helper"
          fi
          exit 0

      # ---------------------------------------------------------------
      # 7) Configure OpenWrt from .config + luci + lldpd + defconfig + proofs
      # ---------------------------------------------------------------
      - name: Config from root .config + luci + lldpd/luci-app-watchcat + defconfig
        run: |
          set -e
          cp /tmp/assets/.config .config
          echo "CONFIG_PACKAGE_luci=y"                    >> .config
          echo "CONFIG_PACKAGE_luci-ssl=y"                >> .config
          echo "CONFIG_PACKAGE_luci-app-watchcat=y"       >> .config
          echo "CONFIG_PACKAGE_watchcat=y"                >> .config
          echo "CONFIG_PACKAGE_lldpd=y"                   >> .config
          echo "CONFIG_PACKAGE_luci-app-lldpd=y"          >> .config
          make defconfig
          cp .config logs/final.config
          echo "Final .config saved to logs/final.config"

      # ---------------------------------------------------------------
      # 8) Build sysupgrade + initramfs
      # ---------------------------------------------------------------
      - name: Build (sysupgrade + initramfs)
        run: |
          set -e
          nproc
          make -j"$(nproc)" V=s 2>&1 | tee logs/build.log
          echo "BUILD-EXIT=$?" | tee -a logs/build.log

      # ---------------------------------------------------------------
      # 9) Package pr-sources + logs
      # ---------------------------------------------------------------
      - name: Package pr-sources + logs
        if: always()
        run: |
          set +e
          mkdir -p dist
          if [ -d pr-sources ]; then
            ( cd pr-sources && zip -rq ../dist/pr-sources-v15.zip . )
            echo "pr-sources zip: $(du -h dist/pr-sources-v15.zip | cut -f1)"
          fi
          if [ -d logs ]; then
            ( cd logs && zip -rq ../dist/logs-v15.zip . )
            echo "logs zip:       $(du -h dist/logs-v15.zip | cut -f1)"
          fi
          ls -lah dist/ || true
          exit 0

      # ---------------------------------------------------------------
      # 10) Upload firmware + PR sources + logs
      # ---------------------------------------------------------------
      - name: Upload firmware + PR sources + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cf-wa350-v15-${{ github.run_number }}
          path: |
            bin/targets/**/*.bin
            bin/targets/**/*.itb
            bin/targets/**/*.tar
            bin/targets/**/*.manifest
            dist/*.zip
          retention-days: 30
          if-no-files-found: warn
