name: build-cf-wa350-v15
# v15 (2026-11-04) - هجين بين build-cf-wa350.yml (للتجميع) و build-cf-wa350-full.yml (لمتانة الدمج)
# - يحتفظ بآلية جمع لقطات لكل PR (من v14)
# - يستبدل pick() الصارم بـ pick() المطور (6 بوابات) من الوركفلو الناجح
# - يزيل البوابات المسببة للفشل: pr_verify, release_gate, policy_gate
# - يحتفظ بجمع الأصول وضغطها مع الصور في artifact واحد

on:
  workflow_dispatch:
    inputs:
      asset_profile:
        description: 'Asset profile to import (m/g/s folder from building-helper)'
        required: true
        default: main
        type: choice
        options: [main, general, special]
      bh_token:
        description: 'Optional GitHub PAT (Contents:Read on building-helper)'
        required: false
        default: ''
        type: string

env:
  BUILDING_HELPER_REPO: https://github.com/haddad2inc/building-helper.git
  UPSTREAM_REPO: https://github.com/openwrt/openwrt.git
  BASE_BRANCH: comfast-cf-wa350-support
  BR_25760: generic-leds-wired-rate-activity
  BR_25761: mac80211-tpt-led-delivered-idle
  BR_25474: ath79-mtd-mx25l12805d-restore-name
  BR_25477: ath79-ar8216-internal-mdio
  MAX_RANGE_COMMITS: "20"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      # -----------------------------------------------------------------
      # 1) Checkout base branch (نستخدم اسم الفرع لضمان المرونة)
      # -----------------------------------------------------------------
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          repository: haddad2inc/openwrt
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0

      # -----------------------------------------------------------------
      # 2) جلب upstream master وكل فروع PR
      # -----------------------------------------------------------------
      - name: Fetch upstream master + the five PR branches
        run: |
          set -e
          mkdir -p logs pr-sources
          git fetch --quiet "$UPSTREAM_REPO" master
          UPMASTER="$(git rev-parse FETCH_HEAD)"
          git fetch origin main \
            "$BR_25760" \
            "$BR_25761" \
            "$BR_25474" \
            "$BR_25477" \
            "$BASE_BRANCH" \
            ci-wa350 || true
          echo "UPMASTER=$UPMASTER" >> "$GITHUB_ENV"
          echo "UPMASTER=$UPMASTER"
          for b in "$BASE_BRANCH" "$BR_25760" "$BR_25761" "$BR_25474" "$BR_25477"; do
            printf 'HEAD %-40s = %s\n' "$b" "$(git rev-parse origin/$b 2>/dev/null || echo MISSING)"
          done

      # -----------------------------------------------------------------
      # 3) جمع لقطات لكل PR (قبل أي دمج)
      #    هذا يضمن أرشفة ملفات كل فرع حتى لو فشل الدمج أو تم تخطيه
      # -----------------------------------------------------------------
      - name: Collect source snapshots per PR (pre-pick)
        run: |
          set +e
          collect_pr() {
            local br="$1" label="$2" ref="origin/$1"
            local dir="pr-sources/$label"
            mkdir -p "$dir/files"
            if ! git rev-parse -q --verify "$ref" >/dev/null 2>&1; then
              echo "BRANCH-MISSING: $br" > "$dir/STATUS.txt"
              echo "MISSING $label"
              return 0
            fi
            local UMB N HEAD_SHA
            HEAD_SHA="$(git rev-parse "$ref")"
            UMB="$(git merge-base "$UPMASTER" "$ref")"
            if [ -z "$UMB" ]; then
              printf 'BRANCH: %s\nHEAD: %s\nSTATUS: NO-MERGE-BASE\n' "$br" "$HEAD_SHA" > "$dir/STATUS.txt"
              return 0
            fi
            N="$(git rev-list --count "$UMB".."$ref")"
            {
              echo "branch:            $br"
              echo "ref:               $ref"
              echo "head-sha:          $HEAD_SHA"
              echo "upstream-merge-base: $UMB"
              echo "commits-above-base:  $N"
              echo "collected-at:      $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            } > "$dir/STATUS.txt"

            git log --oneline "$UMB".."$ref"       > "$dir/commits.txt"
            git diff --name-status "$UMB".."$ref"  > "$dir/files.txt"
            git diff --stat       "$UMB".."$ref"   > "$dir/files.stat.txt"
            git diff              "$UMB".."$ref"   > "$dir/changes.patch"

            while IFS=$'\t' read -r status f1 f2; do
              [ -z "$status" ] && continue
              case "$status" in
                A|M|T)
                  local target="$dir/files/$f1"
                  mkdir -p "$(dirname "$target")"
                  git show "$ref:$f1" > "$target" 2>/dev/null || echo "COPY-FAILED $f1" >> "$dir/STATUS.txt"
                  ;;
                D) echo "DELETED: $f1" >> "$dir/STATUS.txt" ;;
                R*|C*)
                  local target="$dir/files/$f2"
                  mkdir -p "$(dirname "$target")"
                  git show "$ref:$f2" > "$target" 2>/dev/null || true
                  echo "RENAMED: $f1 -> $f2 ($status)" >> "$dir/STATUS.txt"
                  ;;
              esac
            done < "$dir/files.txt"
            echo "COLLECTED $label: $N commits, $(wc -l < "$dir/files.txt") files"
          }

          collect_pr "$BASE_BRANCH" "PR-25040"
          collect_pr "$BR_25760"    "PR-25760"
          collect_pr "$BR_25761"    "PR-25761"
          collect_pr "$BR_25474"    "PR-25474"
          collect_pr "$BR_25477"    "PR-25477"

          {
            echo "# PR Sources Index (v15)"
            echo "Generated: $(date -u)"
            echo "Upstream master: $UPMASTER"
            echo
            for d in pr-sources/*/; do
              echo "## $d"
              sed 's/^/  /' "$d/STATUS.txt" 2>/dev/null | head -20
              echo
            done
          } > pr-sources/INDEX.md
          cat pr-sources/INDEX.md
          exit 0

      # -----------------------------------------------------------------
      # 4) Cherry-pick باستخدام pick() المطورة (6 بوابات)
      #    مستخرجة من build-cf-wa350-full.yml
      # -----------------------------------------------------------------
      - name: Cherry-pick with robust gates (from full workflow)
        run: |
          set +e
          git config user.name  "haddad2inc"
          git config user.email "haddad2inc@gmail.com"
          : > logs/picks.txt
          BASE_SHA_START="$(git rev-parse HEAD)"
          ASSET_DTS="target/linux/ath79/dts/qca9563_comfast_cf-wa350.dts"
          log() { echo "$1" | tee -a logs/picks.txt; }

          # content_state من الوركفلو الناجح (بوابة 3)
          content_state() {
            local m1 m2 s1 s2 st p1 p2 same=0 diff=0
            while read -r m1 m2 s1 s2 st p1 p2; do
              [ -n "$st" ] || continue
              case "$st" in
                D*) if git rev-parse -q --verify "HEAD:$p1" >/dev/null; then diff=$((diff+1)); else same=$((same+1)); fi ;;
                *) [ -n "$p2" ] || p2="$p1"
                   if [ "$s2" != "0000000000000000000000000000000000000000" ] \
                      && [ "$(git rev-parse -q --verify "HEAD:$p2" 2>/dev/null)" = "$s2" ]; then
                     same=$((same+1))
                   else
                     diff=$((diff+1))
                   fi ;;
              esac
            done < <(git show --no-color --no-abbrev --format= --raw -m --first-parent --find-renames "$1")
            [ "$same" -gt 0 ] && [ "$diff" -eq 0 ] && return 0
            [ "$same" -gt 0 ] && return 1
            return 2
          }

          # pick() من الوركفلو الناجح مع 6 بوابات
          pick() {
            local ref="$1" label="$2" sha
            sha="$(git rev-parse "$ref")" || { echo "::error::$label: cannot resolve $ref"; exit 1; }
            # 1) ALREADY-IN-BASE
            if git merge-base --is-ancestor "$sha" HEAD; then
              log "ALREADY-IN-BASE $label $sha"; return 0
            fi
            # 2) EQUIVALENT-IN-BASE
            if git cherry HEAD "$sha" 2>/dev/null | grep -q "^- $sha"; then
              log "EQUIVALENT-IN-BASE $label $sha (patch-id match)"; return 0
            fi
            # 3) TREE-ALREADY-IN-BASE
            content_state "$sha"; local cs=$?
            if [ "$cs" -eq 0 ]; then
              log "TREE-ALREADY-IN-BASE $label $sha"; return 0
            fi
            [ "$cs" -eq 1 ] && log "PARTIAL-CONTENT-IN-BASE $label $sha"

            local out rc
            out="$(git cherry-pick -x "$sha" 2>&1)"; rc=$?
            printf '%s\n' "$out" >> logs/picks.txt
            if [ "$rc" -eq 0 ]; then log "PICKED $label $sha"; return 0; fi

            # 4) EMPTY-AFTER-PICK
            if { printf '%s' "$out" | grep -qi 'now empty'; } \
               || { ! git rev-parse -q --verify CHERRY_PICK_HEAD >/dev/null \
                    && git diff-index --quiet HEAD -- 2>/dev/null \
                    && [ -z "$(git diff --name-only --diff-filter=U)" ]; }; then
              git cherry-pick --skip >/dev/null 2>&1 || git cherry-pick --quit >/dev/null 2>&1
              log "EMPTY-AFTER-PICK $label $sha (change already present; skipped)"; return 0
            fi

            # 5) ASSET-CONFLICT (DTS فقط)
            local UNMERGED="$(git diff --name-only --diff-filter=U)"
            if [ -n "$UNMERGED" ] && [ "$UNMERGED" = "$ASSET_DTS" ]; then
              git checkout --ours -- "$ASSET_DTS" 2>/dev/null && git add -- "$ASSET_DTS"
              if git diff --cached --quiet HEAD 2>/dev/null; then
                git cherry-pick --skip >/dev/null 2>&1 || git cherry-pick --quit >/dev/null 2>&1
                log "ASSET-CONFLICT-EMPTY $label $sha (only DTS conflicted; skipped)"; return 0
              elif GIT_EDITOR=true git cherry-pick --continue >/dev/null 2>&1; then
                log "ASSET-CONFLICT-RESOLVED $label $sha (base kept for DTS)"; return 0
              fi
            fi

            # 6) فشل حقيقي
            {
              echo "=== $label $sha ==="
              printf '%s\n' "$out"
              echo "--- status ---"; git status --porcelain
              echo "--- unmerged ---"; git diff --name-only --diff-filter=U
            } > "logs/conflict-$label.txt" 2>&1
            echo "::error::cherry-pick conflict in $label ($sha) - see artifact logs/conflict-$label.txt"
            git cherry-pick --abort
            exit 1
          }

          # pr_range(): يقيس النطاق مقابل upstream master (مثل الوركفلو الناجح)
          pr_range() {
            local br="$1" label="$2" max="$3" ref UMB N
            ref="origin/$br"
            git rev-parse -q --verify "$ref" >/dev/null || { echo "::error::$label: no such branch"; exit 1; }
            UMB="$(git merge-base "$UPMASTER" "$ref")" || { echo "::error::$label: merge-base failed"; exit 1; }
            N="$(git rev-list --count "$UMB".."$ref")"
            log "$label-RANGE commits=$N max=$max"
            if [ "$N" -lt 1 ]; then
              log "::warning::$label-RANGE-EMPTY: nothing above upstream merge-base"
              return 0
            fi
            if [ "$N" -gt "$max" ]; then
              log "::warning::$label-RANGE-TOO-LARGE: $N > $max (continuing)"
            fi
            for c in $(git rev-list --reverse "$UMB".."$ref"); do
              pick "$c" "$label-$(git log -1 --format=%h "$c")"
            done
          }

          # استدعاء pr_range لكل فرع
          pr_range "$BASE_BRANCH" PR-25040 "$MAX_RANGE_COMMITS"
          pr_range "$BR_25760"    PR-25760 "$MAX_RANGE_COMMITS"
          pr_range "$BR_25761"    PR-25761 "$MAX_RANGE_COMMITS"
          pr_range "$BR_25474"    PR-25474 "$MAX_RANGE_COMMITS"
          pr_range "$BR_25477"    PR-25477 "$MAX_RANGE_COMMITS"

          log "ALL-PICKS-COMPLETED (v15 robust mode)"
          git log --oneline "$BASE_SHA_START..HEAD" | tee -a logs/picks.txt
          exit 0

      # -----------------------------------------------------------------
      # 5) جلب .config من ci-wa350
      # -----------------------------------------------------------------
      - name: Pull .config asset from ci-wa350
        run: |
          set +e
          git fetch --depth 1 origin ci-wa350 || { echo "::error::fetch ci-wa350 failed"; exit 1; }
          mkdir -p /tmp/assets pr-sources/assets-incoming
          git show origin/ci-wa350:.config > /tmp/assets/.config 2>/dev/null \
            || { echo "::error::.config not found in ci-wa350"; exit 1; }
          cp /tmp/assets/.config pr-sources/assets-incoming/.config
          echo "ci-wa350 .config -> /tmp/assets/.config ($(wc -l < /tmp/assets/.config) lines)"
          exit 0

      # -----------------------------------------------------------------
      # 6) استيراد الأصول من building-helper (مع نسخة مرآة)
      # -----------------------------------------------------------------
      - name: Import assets from building-helper (profile-driven)
        env:
          BH_TOKEN: ${{ inputs.bh_token }}
        run: |
          set +e
          PROFILE="${{ inputs.asset_profile }}"
          case "$PROFILE" in
            main)    BH_PATH="m" ;;
            general) BH_PATH="g" ;;
            special) BH_PATH="s" ;;
            *) echo "::error::invalid profile '$PROFILE'"; exit 1 ;;
          esac

          if [ -n "$BH_TOKEN" ]; then
            URL="https://x-access-token:$BH_TOKEN@github.com/haddad2inc/building-helper.git"
          else
            URL="$BUILDING_HELPER_REPO"
          fi

          rm -rf /tmp/bh
          if ! git clone --depth 1 "$URL" /tmp/bh 2>&1 | sed 's|//[^:@/]*:@|//***:@|g'; then
            echo "::warning::building-helper clone failed — continuing without assets"
            exit 0
          fi

          if [ -d "/tmp/bh/$BH_PATH" ]; then
            mkdir -p pr-sources/assets
            cp -a "/tmp/bh/$BH_PATH/." pr-sources/assets/
            echo "Imported /tmp/bh/$BH_PATH -> pr-sources/assets/"
            find pr-sources/assets -maxdepth 2 -type f | head -40
          else
            echo "::warning::no '$BH_PATH' folder in building-helper"
          fi
          exit 0

      # -----------------------------------------------------------------
      # 7) إعداد .config النهائي (luci + lldpd + watchcat + defconfig)
      # -----------------------------------------------------------------
      - name: Config from root .config + luci + lldpd/watchcat + defconfig
        run: |
          set -e
          cp /tmp/assets/.config .config
          sed -i 's/^# CONFIG_PACKAGE_luci is not set/CONFIG_PACKAGE_luci=y/' .config
          # تفعيل lldpd و watchcat قبل defconfig
          for sym in CONFIG_PACKAGE_lldpd CONFIG_PACKAGE_watchcat; do
            sed -i "/^${sym}=/d" .config
            sed -i "/^# ${sym} is not set/d" .config
            echo "${sym}=y" >> .config
          done
          ./scripts/feeds update -a >/dev/null 2>&1
          ./scripts/feeds install -a >/dev/null 2>&1
          make defconfig || exit 1
          # التحقق بعد defconfig
          for sym in CONFIG_PACKAGE_lldpd CONFIG_PACKAGE_watchcat; do
            if ! grep -q "^${sym}=y" .config; then
              echo "::error::${sym} missing after defconfig"
              exit 1
            fi
          done
          cp .config logs/final.config
          echo "Final .config saved to logs/final.config"

      # -----------------------------------------------------------------
      # 8) البناء
      # -----------------------------------------------------------------
      - name: Build (sysupgrade + initramfs)
        run: |
          set -e
          make -j"$(nproc)" V=s 2>&1 | tee logs/build.log
          rc=${PIPESTATUS[0]}
          ls -l bin/targets/ath79/generic/ | tee logs/bin-list.txt
          sha256sum bin/targets/ath79/generic/*cf-wa350* 2>/dev/null | tee logs/images.sha256 || true
          exit "$rc"

      # -----------------------------------------------------------------
      # 9) ضغط لقطات PR والسجلات
      # -----------------------------------------------------------------
      - name: Package pr-sources + logs
        if: always()
        run: |
          set +e
          mkdir -p dist
          if [ -d pr-sources ]; then
            ( cd pr-sources && zip -rq ../dist/pr-sources-v15.zip . )
            echo "pr-sources zip: $(du -h dist/pr-sources-v15.zip | cut -f1)"
          fi
          if [ -d logs ]; then
            ( cd logs && zip -rq ../dist/logs-v15.zip . )
            echo "logs zip: $(du -h dist/logs-v15.zip | cut -f1)"
          fi
          ls -lah dist/ || true
          exit 0

      # -----------------------------------------------------------------
      # 10) رفع كل شيء في artifact واحد
      # -----------------------------------------------------------------
      - name: Upload firmware + PR sources + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cf-wa350-v15-${{ github.run_number }}
          path: |
            bin/targets/ath79/generic/*cf-wa350*
            dist/*.zip
          retention-days: 30
          if-no-files-found: warn
