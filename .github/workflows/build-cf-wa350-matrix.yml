name: CF-WA350 bisect matrix

# =============================================================================
# Diagnostic build matrix — COMFAST CF-WA350 (QCA9563 + QCA8337, qca8k DSA)
#
# GROUND TRUTH (live dmesg of the unit that WORKS in production):
#   Linux version 6.18.44 ... r36159-b4c5ac2908 — MIPS: machine is COMFAST CF-WA350
#   switch0: Atheros AR8337 rev. 2 switch registered on mdio.0
#   qca8k mdio.0:10: Link is Up - 1Gbps/Full   /   DSA: tree 0 setup
#   => working image = DSA/qca8k, kernel 6.18.44, hw_margin_ms = 1000
#
# VARIABLES UNDER TEST: kernel 6.18.44 vs 6.18.52, hw_margin_ms 500 vs 1000,
# Sep-13 head vs Sep-17 head.
#
# KERNEL PINNING - kernel_pin_ref accepts "6.18.NN" (mapped below) or a full
# openwrt/openwrt commit SHA. target/linux/generic/kernel-6.18 is then copied
# VERBATIM from raw.githubusercontent.com (no printf, no hand-typed hash):
#   6.18.38 -> 5b6bc962bd1a7cf61176400b82304e0fcfe71f61
#   6.18.39 -> 276214fc060984a2edf62176f2985ddda7a5fe3f
#   6.18.40 -> 7105bec48f27ea189f0b4a2f41c5e114af2774bd
#   6.18.41 -> d3191cb05603359991ecb8336662cc5408d9c2f9
#   6.18.43 -> a4c51ebd7681f3e5d82e80104e1738436da938c9
#   6.18.44 -> 53a0d54766e90b0263f268949979f730d42bec04   (KNOWN GOOD on this board)
#   6.18.45 -> 5edc3c1b8a0d3b0ea2d0d2688a91ae7e0eadef39
#   6.18.46 -> 87e5289908bc5b7a2fd4a4f5707a757ba335d17a
#   6.18.47 -> af76d8e9b3d9740da9c2fdf228bd54556a67337f
#   6.18.48 -> f42e9340ac1bd01f7d2d2cea00e15437be65e285
#   6.18.49 -> 02f267cbc67cbb7250f5ce678d2d96ed096a31a8
#   6.18.50 -> f1e0c4ac4042bb7a3f9480beb30dae7efa599568
#   6.18.51 -> 829a6e6fb21b3936ebbaec10fbcc0b121b6ffbaa
#   6.18.52 -> ddbf9c85575ccea2414c8ee4a1fdfee0d7152849   (SUSPECTED REGRESSION)
#
# ---------------------------------------------------------------------------
# POST-MORTEM OF THE FIRST RUN (all six cells failed) — BOTH CAUSES WERE IN
# THIS WORKFLOW, NOT IN THE FIRMWARE:
#
#  A) m1/m2/m3/m5 built the images SUCCESSFULLY (Build images: 42-60 min, exit 0)
#     and then died inside ~1 second in "Verify the produced image...".
#     Reason: GitHub Actions runs `run:` with **bash -e** by default. The step
#     contained
#         SYS=$(ls "$D"/openwrt-*sysupgrade.bin 2>/dev/null | head -1 || true)
#     When a glob does not match, `ls` exits 2; `|| true` was attached to
#     `head`, not to `ls`, and with the default pipefail the command
#     substitution returned non-zero -> `bash -e` aborted the step before any
#     of the friendly diagnostics could print. Same trap for the initramfs
#     glob, and for every bare `grep` whose pattern may not match.
#     FIX: `defaults.run.shell: bash` (plain bash, no -e), find-based globs,
#     `|| true` on every grep that may legitimately not match, and a step that
#     accumulates FAIL and exits explicitly.
#
#  B) m4/m6 (the two cells that pin the kernel) failed in "Download sources"
#     after 20-35 s — i.e. exactly the time to fetch one kernel tarball and
#     fail its hash check, while m2/m3 downloaded the SAME 6.18.44 tarball
#     fine. The pinned file came from a multi-line matrix value injected into
#     a `printf` inside single quotes; the hash itself is provably correct
#     (linux-6.18.44.tar.xz = 0f72d938f068...440d43, verified by download).
#     FIX: the pin now downloads target/linux/generic/kernel-6.18 VERBATIM
#     from the upstream bump commit, validates it (2 lines, format, 64-hex
#     hash, no CR, no non-printables, `cat -A` dumped), pre-fetches the
#     tarball and compares sha256 with a clear actual-vs-expected message,
#     and `make download` is retried 3x with full diagnostics.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      kernel_pin_ref:
        description: 'Kernel to pin: a VERSION like 6.18.48 (mapped internally to the upstream bump commit), or a full 40-char openwrt/openwrt commit SHA. kernel-6.18 is then downloaded VERBATIM from raw.githubusercontent.com.'
        required: false
        default: ""
      kernel_override:
        description: 'Fallback pin, format VER|SHA256, e.g. 6.18.48|5ebdadb10a4b5708fc6b1c457764a110bc49f8150cc3502c59b921ead8c6fc8c . Only used when kernel_pin_ref is empty.'
        required: false
        default: ""
      margin_override:
        description: 'hw_margin_ms applied to EVERY cell (e.g. 1000 or 750). Leave EMPTY to keep each cell own value.'
        required: false
        default: ""
      dts_sed:
        description: 'Optional single sed -E expression applied to qca9563_comfast_cf-wa350.dts. Tested: s/spi-max-frequency = <[0-9]+>;/spi-max-frequency = <20000000>;/  --  never delete comment lines, it breaks the C-style block.'
        required: false
        default: ""
      skip_variants:
        description: 'Comma-separated variant names to SKIP, e.g. m2,m3,m5,m6 (substring match). Empty = build all 6 cells.'
        required: false
        default: ""
      extra_config:
        description: 'Extra .config lines (one per line), e.g. CONFIG_PACKAGE_ip-full=y'
        required: false
        default: |
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y

concurrency:
  group: wa350-bisect-${{ github.run_id }}
  cancel-in-progress: false

env:
  SRC_REPO: https://github.com/haddad2inc/openwrt.git
  UPSTREAM: https://github.com/openwrt/openwrt.git

# Plain bash: GitHub's default is `bash -e`, which aborts a step on the first
# non-zero command (e.g. a grep that legitimately finds nothing). Every step
# below handles its own errors and exits explicitly.
defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - variant: m1-head-k6.18.52-m500
            src_repo: fork
            src_ref: 949b9f785c85b32c8daa3acfb9ccd01ce221cae1
            overlay_ref: ""
            kernel_pin_ref: ""
            kernel_file: ""
            kernel_ver: ""
            margin_ms: ""
            expect_dsa: "1"
            note: "current PR head - reported NOT booting (6.18.52 + margin 500)"

          - variant: m2-sep13-k6.18.44-m1000
            src_repo: fork
            src_ref: 3c80ef2c5bc5f1afc8698ae3e52cbcda4321d8bd
            overlay_ref: ""
            kernel_pin_ref: ""
            kernel_file: ""
            kernel_ver: ""
            margin_ms: ""
            expect_dsa: "1"
            note: "Sep-13 head (known-good era): 6.18.44 + margin 1000"

          - variant: m3-sep13-k6.18.44-m500
            src_repo: fork
            src_ref: 00be69e9b96731d9898419754f236cc248002524
            overlay_ref: ""
            kernel_pin_ref: ""
            kernel_file: ""
            kernel_ver: ""
            margin_ms: ""
            expect_dsa: "1"
            note: "Sep-13 late head: 6.18.44 + margin 500 (reported to boot)"

          - variant: m4-head-kpin-6.18.44-m500
            src_repo: fork
            src_ref: 949b9f785c85b32c8daa3acfb9ccd01ce221cae1
            overlay_ref: ""
            kernel_pin_ref: "6.18.44"
            kernel_file: target/linux/generic/kernel-6.18
            kernel_ver: "LINUX_VERSION-6.18 = .44
LINUX_KERNEL_HASH-6.18.44 = 0f72d938f06828e82c90405174fe572287db7bfe089e2fc46572a99a7f240d43"
            margin_ms: ""
            expect_dsa: "1"
            note: "PR head with kernel forced back to 6.18.44 (DECISIVE test)"

          - variant: m5-head-k6.18.52-m1000
            src_repo: fork
            src_ref: 949b9f785c85b32c8daa3acfb9ccd01ce221cae1
            overlay_ref: ""
            kernel_pin_ref: ""
            kernel_file: ""
            kernel_ver: ""
            margin_ms: "1000"
            expect_dsa: "1"
            note: "PR head, kernel 6.18.52, margin restored to 1000"

          - variant: m6-sep13-kpin-6.18.52-m1000
            src_repo: fork
            src_ref: 3c80ef2c5bc5f1afc8698ae3e52cbcda4321d8bd
            overlay_ref: ""
            kernel_pin_ref: "6.18.52"
            kernel_file: target/linux/generic/kernel-6.18
            kernel_ver: "LINUX_VERSION-6.18 = .52
LINUX_KERNEL_HASH-6.18.52 = 2b69564f7d4fea0c859b1959ba33709ee6e9139bd100e30a853b57159a8221b8"
            margin_ms: ""
            expect_dsa: "1"
            note: "known-good tree with kernel forced forward to 6.18.52"

    steps:
      - name: Skip check
        if: contains(inputs.skip_variants, matrix.variant)
        run: |
          echo "::notice::variant ${{ matrix.variant }} skipped by request"
          echo "SKIPPED=1" >> "$GITHUB_ENV"

      - name: Checkout source tree (pinned ref)
        if: env.SKIPPED != '1'
        run: |
          set -uo pipefail
          REF="${{ matrix.src_ref }}"
          if [ "${{ matrix.src_repo }}" = "upstream" ]; then URL="$UPSTREAM"; else URL="$SRC_REPO"; fi
          echo "== cloning $URL @ $REF"
          rm -rf ow
          git init -q ow || exit 1
          cd ow || exit 1
          git remote add origin "$URL"
          git fetch -q --depth 1 origin "$REF" || { echo "::error::fetch of $REF failed"; exit 1; }
          git checkout -q FETCH_HEAD || exit 1
          echo "HEAD      = $(git rev-parse HEAD)"
          echo "HEAD date = $(git log -1 --format=%cI)"
          echo "subject   = $(git log -1 --format=%s)"
          echo "kernel    = $(tr '\n' ' ' < target/linux/generic/kernel-6.18 2>/dev/null || echo n/a)"

      - name: Overlay device files from another ref (optional)
        if: env.SKIPPED != '1' && matrix.overlay_ref != ''
        run: |
          set -uo pipefail
          cd ow
          git config user.name  "ci-wa350"
          git config user.email "ci-wa350@users.noreply.github.com"
          git remote add ovl "$SRC_REPO" 2>/dev/null || true
          git fetch -q --depth 1 ovl "${{ matrix.overlay_ref }}" || { echo "::error::overlay fetch failed"; exit 1; }
          for f in \
            target/linux/ath79/dts/qca9563_comfast_cf-wa350.dts \
            target/linux/ath79/image/generic.mk \
            target/linux/ath79/generic/base-files/etc/board.d/01_leds \
            target/linux/ath79/generic/base-files/etc/board.d/02_network \
            package/utils/cfw-leds ; do
            if git checkout FETCH_HEAD -- "$f"; then echo "   overlaid: $f"; else echo "   !! could not overlay: $f"; fi
          done

      - name: Pin kernel version (verbatim download -> override -> literal)
        if: env.SKIPPED != '1'
        run: |
          set -uo pipefail
          cd ow
          F=target/linux/generic/kernel-6.18
          KREF_IN="${{ inputs.kernel_pin_ref }}"
          KOV_IN="${{ inputs.kernel_override }}"
          KREF_M="${{ matrix.kernel_pin_ref }}"
          MODE="as-is (no pin)"

          if ! command -v curl >/dev/null 2>&1; then
            sudo apt-get update -qq >/dev/null 2>&1
            sudo apt-get install -y -qq curl >/dev/null 2>&1 || true
          fi

          echo "== kernel-6.18 before any pin =="
          cat "$F" 2>/dev/null || echo "   (missing!)"

          REF="${KREF_IN:-$KREF_M}"
          if [ -n "$REF" ]; then
            SHA=""
            case "$REF" in
              6.18.38) SHA=5b6bc962bd1a7cf61176400b82304e0fcfe71f61 ;;
              6.18.39) SHA=276214fc060984a2edf62176f2985ddda7a5fe3f ;;
              6.18.40) SHA=7105bec48f27ea189f0b4a2f41c5e114af2774bd ;;
              6.18.41) SHA=d3191cb05603359991ecb8336662cc5408d9c2f9 ;;
              6.18.43) SHA=a4c51ebd7681f3e5d82e80104e1738436da938c9 ;;
              6.18.44) SHA=53a0d54766e90b0263f268949979f730d42bec04 ;;
              6.18.45) SHA=5edc3c1b8a0d3b0ea2d0d2688a91ae7e0eadef39 ;;
              6.18.46) SHA=87e5289908bc5b7a2fd4a4f5707a757ba335d17a ;;
              6.18.47) SHA=af76d8e9b3d9740da9c2fdf228bd54556a67337f ;;
              6.18.48) SHA=f42e9340ac1bd01f7d2d2cea00e15437be65e285 ;;
              6.18.49) SHA=02f267cbc67cbb7250f5ce678d2d96ed096a31a8 ;;
              6.18.50) SHA=f1e0c4ac4042bb7a3f9480beb30dae7efa599568 ;;
              6.18.51) SHA=829a6e6fb21b3936ebbaec10fbcc0b121b6ffbaa ;;
              6.18.52) SHA=ddbf9c85575ccea2414c8ee4a1fdfee0d7152849 ;;
              *)       SHA="$REF" ;;
            esac
            URL="https://raw.githubusercontent.com/openwrt/openwrt/${SHA}/target/linux/generic/kernel-6.18"
            echo "== pin request: '$REF' -> sha $SHA"
            echo "== fetching $URL"
            if curl -fsSL --retry 5 --retry-delay 3 --max-time 120 "$URL" -o "$F.new"; then
              if grep -qE '^LINUX_VERSION-6\.18 = \.[0-9]+$' "$F.new" \
                 && grep -qE '^LINUX_KERNEL_HASH-6\.18\.[0-9]+ = [0-9a-f]{64}$' "$F.new"; then
                mv "$F.new" "$F"
                MODE="verbatim from openwrt/openwrt@${SHA}"
              else
                echo "::warning::downloaded kernel-6.18 does not look valid - keeping the tree default"
                echo "----- downloaded content -----"; cat -A "$F.new" 2>/dev/null; rm -f "$F.new"
              fi
            else
              echo "::warning::could not download kernel-6.18 from $URL - keeping the tree default"
              rm -f "$F.new"
            fi
          fi

          if [ "$MODE" = "as-is (no pin)" ] && [ -n "$KOV_IN" ]; then
            VER="${KOV_IN%%|*}"; HASH="${KOV_IN##*|}"
            MINOR="${VER##*.}"
            {
              echo "LINUX_VERSION-6.18 = .${MINOR}"
              echo "LINUX_KERNEL_HASH-${VER} = ${HASH}"
            } > "$F"
            MODE="input VER|SHA256 ($VER)"
          fi

          if [ "$MODE" = "as-is (no pin)" ] && [ -n "${{ matrix.kernel_file }}" ]; then
            printf '%s\n' '${{ matrix.kernel_ver }}' > "$F"
            MODE="matrix literal (fallback)"
          fi

          echo "== kernel pin mode: $MODE =="
          echo "== $F (cat) ==";   cat "$F"
          echo "== $F (cat -A) =="; cat -A "$F"
          wc -c -l "$F"

          FAIL=0
          LINES=$(wc -l < "$F")
          [ "$LINES" -eq 2 ] || { echo "::error::$F must have exactly 2 lines, got $LINES"; FAIL=1; }
          grep -qE '^LINUX_VERSION-6\.18 = \.[0-9]+$' "$F" || { echo "::error::bad LINUX_VERSION-6.18 line"; FAIL=1; }
          KV=$(sed -nE 's/^LINUX_VERSION-6\.18 = \.([0-9]+)$/\1/p' "$F")
          [ -n "$KV" ] || { echo "::error::could not parse the kernel minor version"; FAIL=1; }
          if [ -n "$KV" ]; then
            grep -qE "^LINUX_KERNEL_HASH-6\.18\.${KV} = [0-9a-f]{64}$" "$F" \
              || { echo "::error::no LINUX_KERNEL_HASH-6.18.${KV} line with 64 hex chars"; FAIL=1; }
          fi
          if grep -q $'\r' "$F"; then echo "::error::$F contains CR characters"; FAIL=1; fi
          if [ -n "$(tr -d '\11\12\15\40-\176' < "$F")" ]; then
            echo "::error::$F contains non-printable characters"; FAIL=1
          fi
          [ "$FAIL" -eq 0 ] || { echo "----- offending file -----"; cat -A "$F"; exit 1; }

          KH=$(sed -nE "s/^LINUX_KERNEL_HASH-6\.18\.${KV} = ([0-9a-f]{64})$/\1/p" "$F")
          echo "PINNED KERNEL   = 6.18.${KV}"
          echo "EXPECTED SHA256 = ${KH}"
          URLT="https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.18.${KV}.tar.xz"
          echo "TARBALL URL     = ${URLT}"
          curl -sSI --max-time 60 "$URLT" 2>/dev/null | head -n 3 || echo "::warning::HEAD probe failed (not fatal)"

          echo "== pre-fetching and verifying the kernel tarball into dl/ =="
          mkdir -p dl
          if curl -fL --retry 3 --retry-delay 5 --max-time 1500 "$URLT" -o "dl/linux-6.18.${KV}.tar.xz"; then
            ACT=$(sha256sum "dl/linux-6.18.${KV}.tar.xz" | cut -d' ' -f1)
            echo "   downloaded $(stat -c %s "dl/linux-6.18.${KV}.tar.xz") bytes"
            echo "   actual   sha256 = ${ACT}"
            echo "   expected sha256 = ${KH}"
            if [ "$ACT" != "$KH" ]; then
              echo "::error::kernel tarball hash MISMATCH for 6.18.${KV} - the pin in $F is wrong"
              exit 1
            fi
            echo "   hash OK - OpenWrt will reuse dl/linux-6.18.${KV}.tar.xz"
          else
            echo "::warning::could not pre-fetch $URLT - make download will try on its own"
            rm -f "dl/linux-6.18.${KV}.tar.xz"
          fi
          echo "KERNEL_MINOR=${KV}"      >> "$GITHUB_ENV"
          echo "KERNEL_PIN_MODE=${MODE}" >> "$GITHUB_ENV"

      - name: Force hw_margin_ms (dispatch override wins)
        if: env.SKIPPED != '1'
        run: |
          set -uo pipefail
          cd ow
          DTS=target/linux/ath79/dts/qca9563_comfast_cf-wa350.dts
          M="${{ inputs.margin_override }}"
          [ -z "$M" ] && M="${{ matrix.margin_ms }}"
          if [ -n "$M" ]; then
            sed -i -E "s/hw_margin_ms = <[0-9]+>;/hw_margin_ms = <$M>;/" "$DTS"
            echo "== hw_margin_ms forced to $M =="
          fi
          if [ -n "${{ inputs.dts_sed }}" ]; then
            sed -i -E "${{ inputs.dts_sed }}" "$DTS"
            echo "== extra dts_sed applied =="
          fi
          echo "== resulting watchdog / switch lines =="
          grep -n -E "hw_margin_ms|always-running|linux,wdt-gpio|qca8337|sgmii" "$DTS" || echo "   (none matched)"

      - name: Print exactly what will be built
        if: env.SKIPPED != '1'
        run: |
          cd ow || exit 1
          echo "===== device recipe ====="
          grep -n -A9 "define Device/comfast_cf-wa350" target/linux/ath79/image/generic.mk || echo "!! DEVICE RECIPE MISSING"
          echo "===== DTS: watchdog ====="
          sed -n '/watchdog {/,/};/p' target/linux/ath79/dts/qca9563_comfast_cf-wa350.dts || true
          echo "===== DTS: switch ====="
          sed -n '/ethernet-switch@10/,+16p' target/linux/ath79/dts/qca9563_comfast_cf-wa350.dts || true
          sed -n '/ar8327-initvals/,+6p' target/linux/ath79/dts/qca9563_comfast_cf-wa350.dts || true
          echo "===== board.d ====="
          grep -n "cf-wa350" target/linux/ath79/generic/base-files/etc/board.d/01_leds || echo "   (no 01_leds entry)"
          grep -n "cf-wa350" target/linux/ath79/generic/base-files/etc/board.d/02_network || echo "   (no 02_network entry)"
          echo "===== ath79 kernel config: OF_MDIO/PHYLIB/GPIO_WATCHDOG are BUILT IN ====="
          grep -nE "OF_MDIO|MDIO_BUS|FWNODE_MDIO|MDIO_DEVRES|PHYLIB|AR8216_PHY|NET_SELFTESTS" target/linux/ath79/config-6.* 2>/dev/null | head -20 || true
          grep -nE "GPIO_WATCHDOG" target/linux/ath79/generic/config-default 2>/dev/null | head -5 || true
          exit 0

      - name: Install build dependencies
        if: env.SKIPPED != '1'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-dev python3-pyelftools rsync unzip \
            zlib1g-dev file wget swig time ccache qemu-utils device-tree-compiler
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Update and install feeds
        if: env.SKIPPED != '1'
        run: |
          set -euo pipefail
          cd ow
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Seed .config (single device) and defconfig
        if: env.SKIPPED != '1'
        env:
          EXTRA: ${{ inputs.extra_config }}
        run: |
          set -euo pipefail
          cd ow
          {
            echo "CONFIG_TARGET_ath79=y"
            echo "CONFIG_TARGET_ath79_generic=y"
            echo "CONFIG_TARGET_ath79_generic_DEVICE_comfast_cf-wa350=y"
            echo "# CONFIG_TARGET_MULTI_PROFILE is not set"
            echo "# CONFIG_TARGET_PER_DEVICE_ROOTFS is not set"
            echo "CONFIG_TARGET_ROOTFS_SQUASHFS=y"
            echo "CONFIG_TARGET_ROOTFS_INITRAMFS=y"
            echo "# CONFIG_COLLECT_KERNEL_DEBUG is not set"
            echo "CONFIG_DEVEL=y"
            echo "CONFIG_CCACHE=y"
            printf '%s\n' "$EXTRA"
          } > .config
          make defconfig
          echo "== initramfs/squashfs after defconfig =="
          grep -E "^CONFIG_TARGET_ROOTFS_(INITRAMFS|SQUASHFS)" .config || echo "   (neither resolved!)"

      - name: HARD GATE - device and DSA driver must be in the image
        if: env.SKIPPED != '1'
        run: |
          set -uo pipefail
          cd ow
          FAIL=0
          echo "== resolved .config (relevant lines) =="
          grep -E "^CONFIG_TARGET_(ath79|PROFILE)|DEVICE_comfast_cf-wa350|^CONFIG_PACKAGE_(kmod-dsa|kmod-phy-qca83xx|cfw-leds|swconfig|kmod-ath10k-ct)|ROOTFS_INITRAMFS|^CONFIG_LINUX_6" .config || true

          if ! grep -q "^CONFIG_TARGET_ath79_generic_DEVICE_comfast_cf-wa350=y" .config; then
            echo "::error::the device symbol was DROPPED by defconfig -> the device files are missing from this tree"
            echo "== generic.mk =="; grep -n "cf-wa350" target/linux/ath79/image/generic.mk || echo "(no match)"
            echo "== dts dir ==";    ls target/linux/ath79/dts | grep -i wa350 || echo "(no DTS)"
            echo "== board.d ==";    grep -rn "cf-wa350" target/linux/ath79/generic/base-files/etc/board.d/ || echo "(no board.d)"
            FAIL=1
          fi
          if ! grep -q "^CONFIG_PACKAGE_kmod-dsa-qca8k=y" .config; then
            echo "::error::kmod-dsa-qca8k is not selected - DSA cannot work on this board"
            FAIL=1
          fi
          if ! grep -q "^CONFIG_TARGET_ROOTFS_INITRAMFS=y" .config; then
            echo "::error::CONFIG_TARGET_ROOTFS_INITRAMFS did not survive defconfig - no initramfs image would be produced"
            FAIL=1
          fi
          echo "== must be ABSENT (built into the ath79 kernel, or replaced by DSA) =="
          grep -E "^CONFIG_PACKAGE_(swconfig|kmod-of-mdio)=" .config || echo "   OK - swconfig / kmod-of-mdio absent"
          [ "$FAIL" -eq 0 ] || exit 1
          echo "HARD GATE passed"

      - name: Download sources (retry + full diagnostics)
        if: env.SKIPPED != '1'
        run: |
          set -uo pipefail
          cd ow
          echo "== disk before download =="; df -h . | sed 's/^/   /'
          mkdir -p logs
          N=0; RC=1
          while [ "$N" -lt 3 ] && [ "$RC" -ne 0 ]; do
            N=$((N+1))
            echo "===== make download attempt $N/3 ====="
            make -j"$(nproc)" download V=s > "logs/download-$N.log" 2>&1
            RC=$?
            echo "   attempt $N exit code: $RC"
            if [ "$RC" -ne 0 ]; then
              echo "----- last 120 lines of attempt $N -----"
              tail -n 120 "logs/download-$N.log"
              echo "----- lines that look like an error -----"
              grep -n -iE "hash|checksum|mismatch|failed|error|cannot|No such|404|Not found|timeout|timed out" "logs/download-$N.log" | tail -n 60 || true
              echo "----- dl/ contents -----"; ls -la dl 2>/dev/null | tail -n 30 || true
              for f in dl/linux-6.18.*; do
                [ -e "$f" ] || continue
                echo "   $(basename "$f"): $(stat -c %s "$f") bytes"
                echo "   actual   sha256: $(sha256sum "$f" | cut -d' ' -f1)"
              done
              echo "   expected sha256: $(sed -nE 's/^LINUX_KERNEL_HASH-6\.18\.[0-9.]+ = ([0-9a-f]{64})$/\1/p' target/linux/generic/kernel-6.18)"
              echo "----- kernel-6.18 as the build sees it -----"; cat -A target/linux/generic/kernel-6.18
              echo "----- disk after failed attempt -----"; df -h . | sed 's/^/   /'
              sleep 20
            fi
          done
          cp -f "logs/download-$N.log" logs/download.log 2>/dev/null || true
          if [ "$RC" -ne 0 ]; then
            echo "::error::make download failed after $N attempt(s) - see the diagnostics above"
            exit "$RC"
          fi
          echo "== download OK on attempt $N =="
          df -h . | sed 's/^/   /'

      - name: Build images
        if: env.SKIPPED != '1'
        run: |
          set -uo pipefail
          cd ow
          mkdir -p logs
          echo "== build started $(date -u +%FT%TZ) =="
          make -j"$(nproc)" V=s > logs/build.log 2>&1
          RC=$?
          echo "== build exit code: $RC (finished $(date -u +%FT%TZ)) =="
          tail -n 60 logs/build.log
          if [ "$RC" -ne 0 ]; then
            echo "==== BUILD FAILED - last 250 lines ===="
            tail -n 250 logs/build.log
            echo "==== lines that look like an error ===="
            grep -n -iE "error|failed|No rule to make|cannot|exceeded|too large" logs/build.log | tail -n 80 || true
            exit "$RC"
          fi

      - name: Verify the produced image really contains this board
        if: env.SKIPPED != '1'
        env:
          EXPECT_DSA: ${{ matrix.expect_dsa }}
        run: |
          set -uo pipefail
          cd ow || exit 1
          D=bin/targets/ath79/generic
          FAIL=0
          echo "== artifacts in $D =="
          ls -la "$D" 2>/dev/null | sed 's/^/   /' || { echo "::error::$D does not exist"; exit 1; }
          echo "== sha256 of every image =="
          for f in "$D"/*.bin; do [ -e "$f" ] && echo "   $(sha256sum "$f")"; done

          # find-based globs: never abort the step when nothing matches
          SYS=$(find "$D" -maxdepth 1 -name 'openwrt-*comfast_cf-wa350*squashfs-sysupgrade.bin' 2>/dev/null | head -1)
          INI=$(find "$D" -maxdepth 1 -name 'openwrt-*comfast_cf-wa350*initramfs-kernel.bin'  2>/dev/null | head -1)
          [ -n "$SYS" ] && echo "== sysupgrade: $SYS" || { echo "::error::no sysupgrade image for comfast_cf-wa350"; FAIL=1; }
          [ -n "$INI" ] && echo "== initramfs : $INI" || { echo "::error::no initramfs image for comfast_cf-wa350"; FAIL=1; }

          KVER=$(grep -m1 -oE "6\.[0-9]+\.[0-9]+" "$D"/version.buildinfo 2>/dev/null | head -1)
          [ -z "$KVER" ] && KVER=$(grep -m1 -oE "Linux version [0-9.]+" logs/build.log 2>/dev/null | awk '{print $3}')
          echo "== kernel in image = ${KVER:-unknown}  (pin mode: ${KERNEL_PIN_MODE:-n/a})"

          if [ -n "$SYS" ]; then
            SZ=$(stat -c %s "$SYS"); LIMIT=$((16000*1024))
            echo "== size: $SZ bytes / partition $LIMIT bytes (IMAGE_SIZE 16000k)"
            if [ "$SZ" -gt "$LIMIT" ]; then echo "::error::image bigger than the firmware partition"; FAIL=1; fi

            # Dump the strings ONCE to a file. `strings | grep -q` under pipefail
            # is a trap: grep exits at the first match, strings dies with SIGPIPE
            # (141) and the pipeline reports failure even though the string IS
            # there -> permanent false negatives.
            echo "== strings that must appear in kernel+DTB =="
            STR=/tmp/wa350-strings.txt
            if command -v strings >/dev/null 2>&1; then
              strings -a "$SYS" > "$STR" 2>/dev/null || true
            else
              echo "   (binutils strings unavailable - falling back to tr/grep)"
              tr -c '[:print:]' '\n' < "$SYS" | grep -E '.{4,}' > "$STR" 2>/dev/null || true
            fi
            echo "   extracted $(wc -l < "$STR") printable lines"
            chk() { if grep -qF -- "$1" "$STR"; then echo "   OK   '$1'"; else echo "   MISS '$1'${2:+ - $2}"; FAIL=1; fi; }
            chk "COMFAST CF-WA350"
            chk "comfast,cf-wa350"
            chk "linux,wdt-gpio"
            chk "always-running"
            if [ "${EXPECT_DSA:-1}" = "1" ]; then
              chk "qca,qca8337" "DSA switch node absent"
              chk "ethernet-ports" "DSA ports node absent"
            else
              chk "qca,ar8327-initvals" "swconfig initvals absent"
            fi

            echo "== extract the appended DTB and inspect it (authoritative check) =="
            KBIN=$(find "$D" -maxdepth 1 -name 'openwrt-*comfast_cf-wa350*-kernel.bin' | head -1)
            SRCBIN="${KBIN:-$SYS}"
            echo "   source: $SRCBIN"
            if [ -x scripts/dtb-extract-kernel ] || [ -f scripts/dtb-extract-kernel ]; then
              if scripts/dtb-extract-kernel "$SRCBIN" /tmp/kernel.dtb 2>/tmp/dtb.err; then
                echo "   DTB extracted: $(stat -c %s /tmp/kernel.dtb 2>/dev/null) bytes"
                DTBFILE=/tmp/kernel.dtb
                if command -v fdtdump >/dev/null 2>&1; then
                  fdtdump "$DTBFILE" > /tmp/dtb.txt 2>/dev/null || true
                  echo "   model        : $(grep -m1 -oE 'model = "[^"]+"' /tmp/dtb.txt || echo n/a)"
                  echo "   compatible   : $(grep -m1 -oE 'compatible = "[^"]+"' /tmp/dtb.txt || echo n/a)"
                  for pat in 'linux,wdt-gpio' 'always-running' 'hw_margin_ms' 'qca,qca8337' 'ethernet-switch@10' 'ethernet-ports'; do
                    if grep -q "$pat" /tmp/dtb.txt; then echo "   OK   DTB has '$pat'"; else echo "   MISS DTB lacks '$pat'"; FAIL=1; fi
                  done
                  echo "   --- watchdog + switch nodes as compiled ---"
                  grep -n -A8 "watchdog" /tmp/dtb.txt | head -30 || true
                  grep -n -A6 "ethernet-switch" /tmp/dtb.txt | head -40 || true
                else
                  echo "   (fdtdump unavailable) strings on the DTB instead:"
                  strings -a "$DTBFILE" > /tmp/dtb-strings.txt 2>/dev/null || true
                  grep -E "wdt-gpio|qca8337|cf-wa350|always-running" /tmp/dtb-strings.txt | head -10 || true
                fi
              else
                echo "   ::warning::dtb-extract-kernel failed: $(cat /tmp/dtb.err 2>/dev/null | head -3)"
              fi
            else
              echo "   (scripts/dtb-extract-kernel not present in this tree - relying on strings)"
            fi
          fi

          echo "== kmod vermagic vs built kernel =="
          QK=$(find build_dir -name "qca8k.ko" 2>/dev/null | head -1)
          if [ -n "$QK" ]; then
            VM=$(modinfo -F vermagic "$QK" 2>/dev/null)
            echo "   qca8k vermagic = $VM"
            if [ -n "$KVER" ] && [ -n "$VM" ] && ! echo "$VM" | grep -q "$KVER"; then
              echo "::error::vermagic mismatch -> modules would NOT load (no DSA, dead network)"; FAIL=1
            fi
          else
            echo "   (qca8k.ko not found in build_dir - skipped)"
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::image verification FAILED - do NOT flash this artifact"
            exit 1
          fi
          echo "== image verification OK =="

      - name: Build info
        if: always() && env.SKIPPED != '1'
        run: |
          set -uo pipefail
          cd ow || exit 0
          D=bin/targets/ath79/generic
          mkdir -p "$D"
          {
            echo "variant         = ${{ matrix.variant }}"
            echo "note            = ${{ matrix.note }}"
            echo "src_ref         = ${{ matrix.src_ref }}"
            echo "overlay_ref     = ${{ matrix.overlay_ref }}"
            echo "head_sha        = $(git rev-parse HEAD 2>/dev/null)"
            echo "kernel_pin_ref  = ${{ inputs.kernel_pin_ref }} / ${{ matrix.kernel_pin_ref }}"
            echo "kernel_override = ${{ inputs.kernel_override }}"
            echo "kernel_pin_mode = ${KERNEL_PIN_MODE:-n/a}"
            echo "margin_override = ${{ inputs.margin_override }} / ${{ matrix.margin_ms }}"
            echo "dts_sed         = ${{ inputs.dts_sed }}"
            echo "expect_dsa      = ${{ matrix.expect_dsa }}"
            echo "--- version.buildinfo ---"; cat "$D"/version.buildinfo 2>/dev/null || true
            echo "--- kernel-6.18 ---";       cat target/linux/generic/kernel-6.18 2>/dev/null || true
            echo "--- hw_margin_ms ---";    grep -o 'hw_margin_ms = <[0-9]*>' target/linux/ath79/dts/qca9563_comfast_cf-wa350.dts 2>/dev/null || true
            echo "built_at        = $(date -u +%FT%TZ)"
            echo "run_url         = ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$D/BUILD-INFO.txt"
          cat "$D/BUILD-INFO.txt"
          (cd "$D" && sha256sum *.bin > sha256sums.ci 2>/dev/null) || true
          cat "$D/sha256sums.ci" 2>/dev/null || true
          exit 0

      - name: Job summary
        if: always()
        run: |
          {
            echo "## ${{ matrix.variant }}"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| note | ${{ matrix.note }} |"
            echo "| src_ref | \`${{ matrix.src_ref }}\` |"
            echo "| kernel_pin_ref | \`${{ inputs.kernel_pin_ref }}\` / \`${{ matrix.kernel_pin_ref }}\` |"
            echo "| hw_margin_ms | \`${{ inputs.margin_override }}\` / \`${{ matrix.margin_ms }}\` |"
            echo "| expect DSA | ${{ matrix.expect_dsa }} |"
            echo ""
            echo "Artifacts: **cf-wa350-${{ matrix.variant }}** (images + .config + BUILD-INFO) and **cf-wa350-${{ matrix.variant }}-log** (build + download logs)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cf-wa350-${{ matrix.variant }}
          path: |
            ow/bin/targets/ath79/generic/openwrt-*comfast_cf-wa350*
            ow/bin/targets/ath79/generic/sha256sums*
            ow/bin/targets/ath79/generic/BUILD-INFO.txt
            ow/bin/targets/ath79/generic/config.buildinfo
            ow/bin/targets/ath79/generic/version.buildinfo
            ow/.config
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cf-wa350-${{ matrix.variant }}-log
          path: |
            ow/logs/build.log
            ow/logs/download*.log
          if-no-files-found: ignore
