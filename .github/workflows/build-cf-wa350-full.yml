name: build-cf-wa350-full

# Builds one CF-WA350 image that combines every piece of the project:
#   base branch  : comfast-cf-wa350-support = PR #25040 device commit (freshest, rebased on current main)
#   + kernel_branch range : commits above merge-base with base_branch are cherry-picked
#   + PR #25474  : 460 macronix .name restore            (cherry-pick, optional)
#   + PR #25477  : 731 ar8216 guard                     (cherry-pick, optional)
#   + PR #25040  : device commit                        (cherry-pick, optional)
#   + ci-wa350   : DTS variant (sha-gated) and .config asset
#   + building-helper : optional custom files/ and luci-theme-enan-dashboard package
#
# v11 (2026-10-19): kernel_branch default switched to generic-leds-wired-rate-activity,
# which carries the new patch:
#   target/linux/qualcommax/patches-6.18/0956-net-dsa-qca8k-support-the-qca-etype-tagging-protocol.patch
# The cherry-pick range will include it if it exists as a commit on that branch.

on:
  workflow_dispatch:
    inputs:
      output_suffix:
        description: 'Optional suffix appended to all artifact names (e.g. "test1")'
        required: false
        default: ''
        type: string
      base_branch:
        description: "Base branch of the integration build (device commit = PR #25040 head)"
        required: false
        default: comfast-cf-wa350-support
        type: choice
        options:
          - comfast-cf-wa350-support
          - k1-qca8k-stats
          - main
      kernel_branch:
        description: "Branch carrying the kernel patches (generic-leds-wired-rate-activity); commits above merge-base with the base branch are picked"
        required: false
        default: generic-leds-wired-rate-activity
        type: string
      include_kernel_patches:
        description: "Cherry-pick the kernel_branch commit range"
        required: false
        default: true
        type: boolean
      include_pr25474:
        description: "Cherry-pick PR #25474 (patch 460 macronix .name restore)"
        required: false
        default: true
        type: boolean
      include_pr25477:
        description: "Cherry-pick PR #25477 (patch 731 ar8216 guard)"
        required: false
        default: true
        type: boolean
      include_pr25040:
        description: "Cherry-pick PR #25040 (device commit; skipped automatically when the base already carries its content)"
        required: false
        default: true
        type: boolean
      dts_file:
        description: DTS variant from root dts/ folder on ci-wa350
        required: false
        default: qca9563_comfast_cf-wa350.dts
        type: choice
        options:
          - qca9563_comfast_cf-wa350.dts
          - qca9563_comfast_cf-wa350-internal-mdio.dts
          - qca9563_comfast_cf-wa350-explicit-mdio.dts
          - qca9563_comfast_cf-wa350-external.dts
      include_files:
        description: 'Inject custom files from "files" directory (building-helper)'
        required: false
        default: false
        type: boolean
      attach_theme:
        description: 'Import luci-theme-enan-dashboard package and enable it in .config'
        required: false
        default: false
        type: boolean

env:
  BUILDING_HELPER_REPO: https://github.com/haddad2inc/building-helper.git

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          repository: haddad2inc/openwrt
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Fetch branches used by the gates
        run: |
          set +e
          mkdir -p logs
          git fetch origin main \
                           "${{ inputs.kernel_branch }}" \
                           comfast-cf-wa350-support \
                           ath79-mtd-mx25l12805d-restore-name \
                           ath79-ar8216-internal-mdio || { echo "::error::fetch branches failed"; exit 1; }
          {
            echo "base_branch    = ${{ inputs.base_branch }} $(git rev-parse HEAD)"
            echo "kernel_branch  = ${{ inputs.kernel_branch }} $(git rev-parse origin/${{ inputs.kernel_branch }} 2>/dev/null || git rev-parse ${{ inputs.kernel_branch }})"
            echo "PR-25040 head  = $(git rev-parse origin/comfast-cf-wa350-support)"
            echo "PR-25474 head  = $(git rev-parse origin/ath79-mtd-mx25l12805d-restore-name)"
            echo "PR-25477 head  = $(git rev-parse origin/ath79-ar8216-internal-mdio)"
            echo "fork main      = $(git rev-parse origin/main)"
          } | tee logs/heads.txt
          exit 0

      - name: Cherry-pick kernel range + our PRs
        run: |
          set +e
          git config user.name "haddad2inc"
          git config user.email "haddad2inc@gmail.com"
          : > logs/picks.txt
          BASE_SHA="$(git rev-parse HEAD)"
          ASSET_DTS="target/linux/ath79/dts/qca9563_comfast_cf-wa350.dts"

          log() { echo "$1" | tee -a logs/picks.txt; }

          content_state() {
            local m1 m2 s1 s2 st p1 p2 same=0 diff=0
            while read -r m1 m2 s1 s2 st p1 p2; do
              [ -n "$st" ] || continue
              case "$st" in
                D*) if git rev-parse -q --verify "HEAD:$p1" >/dev/null; then diff=$((diff+1)); else same=$((same+1)); fi ;;
                *)  [ -n "$p2" ] || p2="$p1"
                    if [ "$s2" != "0000000000000000000000000000000000000000" ] \
                       && [ "$(git rev-parse -q --verify "HEAD:$p2" 2>/dev/null)" = "$s2" ]; then
                      same=$((same+1))
                    else
                      diff=$((diff+1))
                    fi ;;
              esac
            done < <(git show --no-color --no-abbrev --format= --raw -m --first-parent --find-renames "$1")
            [ "$same" -gt 0 ] && [ "$diff" -eq 0 ] && return 0
            [ "$same" -gt 0 ] && return 1
            return 2
          }

          pick() {
            local ref="$1" label="$2" sha
            sha="$(git rev-parse "$ref")" || { echo "::error::$label: cannot resolve $ref"; exit 1; }
            if git merge-base --is-ancestor "$sha" HEAD; then
              log "ALREADY-IN-BASE $label $sha"
              return 0
            fi
            if git cherry HEAD "$sha" 2>/dev/null | grep -q "^- $sha"; then
              log "EQUIVALENT-IN-BASE $label $sha (patch-id match; rebased/re-signed twin)"
              return 0
            fi
            content_state "$sha"; cs=$?
            if [ "$cs" -eq 0 ]; then
              log "TREE-ALREADY-IN-BASE $label $sha (every touched blob identical at HEAD)"
              return 0
            fi
            [ "$cs" -eq 1 ] && log "PARTIAL-CONTENT-IN-BASE $label $sha (some blobs already identical; picking the rest)"
            local out rc
            out="$(git cherry-pick -x "$sha" 2>&1)"
            rc=$?
            printf '%s\n' "$out" >> logs/picks.txt
            if [ "$rc" -eq 0 ]; then
              log "PICKED $label $sha"
              return 0
            fi
            if { printf '%s' "$out" | grep -qi 'now empty'; } \
               || { ! git rev-parse -q --verify CHERRY_PICK_HEAD >/dev/null \
                    && git diff-index --quiet HEAD -- 2>/dev/null \
                    && [ -z "$(git diff --name-only --diff-filter=U)" ]; }; then
              git cherry-pick --skip >/dev/null 2>&1 || git cherry-pick --quit >/dev/null 2>&1
              log "EMPTY-AFTER-PICK $label $sha (change already present; skipped, nothing lost)"
              return 0
            fi
            UNMERGED="$(git diff --name-only --diff-filter=U)"
            if [ -n "$UNMERGED" ] && [ "$UNMERGED" = "$ASSET_DTS" ]; then
              git checkout --ours -- "$ASSET_DTS" 2>/dev/null && git add -- "$ASSET_DTS"
              if git diff --cached --quiet HEAD 2>/dev/null; then
                git cherry-pick --skip >/dev/null 2>&1 || git cherry-pick --quit >/dev/null 2>&1
                log "ASSET-CONFLICT-EMPTY $label $sha (only the asset-managed DTS conflicted; resolved to base; remainder already in base - skipped, nothing lost)"
                return 0
              elif GIT_EDITOR=true git cherry-pick --continue >/dev/null 2>&1; then
                log "ASSET-CONFLICT-RESOLVED $label $sha (only the asset-managed DTS conflicted; base kept - Inject-DTS overwrites it from the asset and sha-gates it)"
                return 0
              fi
              log "ASSET-CONFLICT-RESOLVE-FAILED $label $sha (falling through to hard fail)"
            fi
            {
              echo "=== $label $sha ==="
              printf '%s\n' "$out"
              echo "--- git status --porcelain ---"
              git status --porcelain
              echo "--- unmerged files ---"
              git diff --name-only --diff-filter=U
              for f in $(git diff --name-only --diff-filter=U); do
                echo "--- diff HEAD..$sha -- $f ---"
                git diff "HEAD..$sha" -- "$f"
              done
            } > "logs/conflict-$label.txt" 2>&1
            echo "::error::cherry-pick conflict in $label ($sha) - see artifact logs/conflict-$label.txt"
            cat "logs/conflict-$label.txt"
            git cherry-pick --abort
            exit 1
          }

          if [ "${{ inputs.include_kernel_patches }}" = "true" ]; then
            KB="${{ inputs.kernel_branch }}"
            git rev-parse -q --verify "origin/$KB" >/dev/null && KB="origin/$KB"
            MB="$(git merge-base "$KB" HEAD)"
            N="$(git rev-list --count "$MB..$KB")"
            log "KERNEL-RANGE $KB merge-base=$MB commits=$N"
            if [ "$N" -gt 0 ]; then
              for c in $(git rev-list --reverse "$MB..$KB"); do
                pick "$c" "KERNEL-$(git log -1 --format=%h $c)"
              done
            else
              log "KERNEL-RANGE-EMPTY $KB (nothing above merge-base)"
            fi
          fi
          [ "${{ inputs.include_pr25474 }}" = "true" ] && pick origin/ath79-mtd-mx25l12805d-restore-name PR-25474
          [ "${{ inputs.include_pr25477 }}" = "true" ] && pick origin/ath79-ar8216-internal-mdio PR-25477
          [ "${{ inputs.include_pr25040 }}" = "true" ] && pick origin/comfast-cf-wa350-support PR-25040
          log "HEAD-NOW $(git rev-parse HEAD) (base was $BASE_SHA)"
          git log --oneline "$BASE_SHA..HEAD" | tee -a logs/picks.txt
          exit 0

      - name: Pull root assets (dts from main, fallback ci-wa350; .config from ci-wa350)
        run: |
          set +e
          git fetch --depth 1 origin ci-wa350 || exit 1
          mkdir -p /tmp/assets
          F="${{ inputs.dts_file }}"
          if git show "origin/main:dts/$F" > /tmp/assets/dts 2>/dev/null && [ -s /tmp/assets/dts ]; then
            DTS_SRC="main"
          elif git show "origin/ci-wa350:dts/$F" > /tmp/assets/dts 2>/dev/null && [ -s /tmp/assets/dts ]; then
            DTS_SRC="ci-wa350"
          else
            echo "::error::dts asset $F not found on origin/main nor origin/ci-wa350"
            exit 1
          fi
          git show "origin/ci-wa350:.config" > /tmp/assets/.config || exit 1
          { echo "dts_file   = $F"; echo "dts_source = $DTS_SRC"; echo "cfg_source = ci-wa350"; } | tee logs/asset-source.txt
          sha256sum /tmp/assets/* | tee logs/assets.sha256
          exit 0

      - name: Inject DTS + classify variant + sha gate
        run: |
          set +e
          D=target/linux/ath79/dts/qca9563_comfast_cf-wa350.dts
          cp /tmp/assets/dts "$D"
          S="$(sha256sum "$D" | cut -d' ' -f1)"
          case "${{ inputs.dts_file }}" in
            *external*)      V=EXTERNAL-MDIO;         E=c7cd13705d797229600a2d85f180fdb6736f39b493a7205c0211c746aaf015ca ;;
            *explicit*)      V=INTERNAL-EXPLICIT;     E=a755306340109abe2c63c47adb4144131011e12913f7ee3781c095be1dbe637e ;;
            *internal-mdio*) V=INTERNAL-MDIO-PRE-SWAP; E=1544a5482fabf497479b6acb6d21ec68ab450a7f253239b84ff61fd843c9bb30 ;;
            *)               V=INTERNAL-LEGACY;       E=c393c70bda0890e79ee4263306a2ac3a1ea2ad72cc27e22334a125960374778d ;;
          esac
          { echo "variant    = $V"; echo "dts_file   = ${{ inputs.dts_file }}"; echo "dts_sha256 = $S"; } | tee logs/variant.txt
          [ "$S" = "$E" ] || { echo "::error::DTS sha mismatch"; exit 1; }
          echo "V=$V" >> "$GITHUB_ENV"
          exit 0

      - name: Import building-helper repository
        if: ${{ inputs.include_files == true || inputs.attach_theme == true }}
        run: |
          set +e
          echo "=== Importing building-helper repository ===" | tee -a logs/building-helper.txt
          BUILD_HELPER_DIR="/tmp/building-helper"
          rm -rf "$BUILD_HELPER_DIR"
          if git clone --depth 1 "$BUILDING_HELPER_REPO" "$BUILD_HELPER_DIR" 2>&1 | tee -a logs/building-helper.txt; then
            echo "✅ building-helper clone succeeded." | tee -a logs/building-helper.txt
          else
            echo "::error::building-helper clone FAILED."
            exit 1
          fi
          rm -rf "$BUILD_HELPER_DIR/.git"
          echo "=== Contents of building-helper (top-level) ===" | tee -a logs/building-helper.txt
          ls -la "$BUILD_HELPER_DIR" | tee -a logs/building-helper.txt
          exit 0

      - name: Inject custom files from building-helper (include_files=true)
        if: ${{ inputs.include_files == true }}
        run: |
          set +e
          echo "=== Injecting custom files (include_files=true) ===" | tee -a logs/building-helper.txt
          SRC_DIR="/tmp/building-helper/files"
          if [ ! -d "$SRC_DIR" ]; then
            echo "::error::$SRC_DIR not found in building-helper."
            ls -la /tmp/building-helper | tee -a logs/building-helper.txt
            exit 1
          fi
          mkdir -p files
          cp -rv "$SRC_DIR"/. files/ 2>&1 | tee -a logs/building-helper.txt
          echo "✅ Custom files injected into ./files/" | tee -a logs/building-helper.txt
          find files -maxdepth 3 -type f | sort | tee -a logs/building-helper.txt
          exit 0

      - name: Skip files notice (include_files=false)
        if: ${{ inputs.include_files != true }}
        run: |
          echo "=== include_files=false → skipping custom files injection ===" | tee -a logs/building-helper.txt

      - name: Import luci-theme-enan-dashboard package (attach_theme=true)
        if: ${{ inputs.attach_theme == true }}
        run: |
          set +e
          echo "=== Importing luci-theme-enan-dashboard from building-helper ===" | tee -a logs/building-helper.txt
          SRC_DIR="/tmp/building-helper/luci-theme-enan-dashboard"
          TARGET_PARENT="package"
          TARGET_DIR="$TARGET_PARENT/luci-theme-enan-dashboard"
          if [ ! -d "$SRC_DIR" ]; then
            echo "::error::$SRC_DIR not found in building-helper."
            ls -la /tmp/building-helper | tee -a logs/building-helper.txt
            exit 1
          fi
          mkdir -p "$TARGET_PARENT"
          rm -rf "$TARGET_DIR"
          cp -rv "$SRC_DIR" "$TARGET_PARENT"/ 2>&1 | tee -a logs/building-helper.txt
          chmod -R u+rwX,go+rX "$TARGET_DIR" 2>&1 | tee -a logs/building-helper.txt
          find "$TARGET_DIR" -type f -name "*.sh" -exec chmod +x {} \; 2>&1 | tee -a logs/building-helper.txt
          find "$TARGET_DIR" -type f -name "Makefile" -exec chmod 644 {} \; 2>&1 | tee -a logs/building-helper.txt
          find "$TARGET_DIR/files" -type f -exec chmod +x {} \; 2>/dev/null || true
          if [ -f "$TARGET_DIR/Makefile" ]; then
            echo "✅ Makefile found at $TARGET_DIR/Makefile" | tee -a logs/building-helper.txt
            head -n 20 "$TARGET_DIR/Makefile" | tee -a logs/building-helper.txt
          else
            echo "::error::Makefile NOT found in $TARGET_DIR"
            exit 1
          fi
          echo "✅ luci-theme-enan-dashboard package import completed." | tee -a logs/building-helper.txt
          exit 0

      - name: Skip theme notice (attach_theme=false)
        if: ${{ inputs.attach_theme != true }}
        run: |
          echo "=== attach_theme=false → skipping luci-theme-enan-dashboard import ===" | tee -a logs/building-helper.txt

      - name: Config from root .config + luci/ethtool + lldpd/watchcat + defconfig + proofs
        run: |
          set +e
          cp /tmp/assets/.config .config

          sed -i 's/^# CONFIG_PACKAGE_luci is not set/CONFIG_PACKAGE_luci=y/' .config

          if [ "${{ inputs.attach_theme }}" = "true" ]; then
            echo "--- Injecting CONFIG_PACKAGE_luci-theme-enan-dashboard=y ---" | tee -a logs/building-helper.txt
            sed -i '/^CONFIG_PACKAGE_luci-theme-enan-dashboard=/d' .config
            sed -i '/^# CONFIG_PACKAGE_luci-theme-enan-dashboard is not set/d' .config
            echo 'CONFIG_PACKAGE_luci-theme-enan-dashboard=y' >> .config
          fi

          force_enable_pre() {
            local sym="$1"
            echo "--- Force-enabling ${sym}=y (pre-defconfig) ---" | tee -a logs/config-proof.txt
            sed -i "/^${sym}=/d"                     .config
            sed -i "/^# ${sym} is not set/d"         .config
            echo "${sym}=y" >> .config
          }
          force_enable_pre "CONFIG_PACKAGE_lldpd"
          force_enable_pre "CONFIG_PACKAGE_watchcat"

          ./scripts/feeds update -a >/dev/null 2>&1
          ./scripts/feeds install -a >/dev/null 2>&1
          make defconfig || exit 1

          need_redefconfig=0
          force_enable_post() {
            local sym="$1"
            if grep -q "^${sym}=y" .config; then
              echo "✅ ${sym}=y survived defconfig." | tee -a logs/config-proof.txt
              return 0
            fi
            echo "⚠️ ${sym} not =y after defconfig → re-forcing." | tee -a logs/config-proof.txt
            sed -i "/^${sym}=/d"             .config
            sed -i "/^# ${sym} is not set/d" .config
            echo "${sym}=y" >> .config
            need_redefconfig=1
          }
          force_enable_post "CONFIG_PACKAGE_lldpd"
          force_enable_post "CONFIG_PACKAGE_watchcat"

          if [ "$need_redefconfig" -eq 1 ]; then
            echo "--- Re-running defconfig to merge re-forced lldpd/watchcat ---" | tee -a logs/config-proof.txt
            make defconfig || exit 1
            if ! grep -q '^CONFIG_PACKAGE_lldpd=y' .config || \
               ! grep -q '^CONFIG_PACKAGE_watchcat=y' .config; then
              echo "::error::defconfig refuses to keep lldpd/watchcat=y - dependencies likely missing on this branch"
              grep -E 'lldpd|watchcat' .config | tee -a logs/config-proof.txt
              exit 1
            fi
          fi

          grep -E '^CONFIG_TARGET_PROFILE=|^CONFIG_PACKAGE_kmod-dsa-qca8k=|^CONFIG_TARGET_ROOTFS_INITRAMFS=|^CONFIG_GCC_VERSION=|^CONFIG_PACKAGE_luci=|^CONFIG_PACKAGE_ethtool=|^CONFIG_PACKAGE_luci-theme-enan-dashboard=|^CONFIG_PACKAGE_lldpd=|^CONFIG_PACKAGE_watchcat=' .config | tee -a logs/config-proof.txt

          grep -q '^CONFIG_PACKAGE_luci=y'     .config || { echo "::error::luci missing after defconfig";     exit 1; }
          grep -q '^CONFIG_PACKAGE_lldpd=y'    .config || { echo "::error::lldpd missing after defconfig";    exit 1; }
          grep -q '^CONFIG_PACKAGE_watchcat=y' .config || { echo "::error::watchcat missing after defconfig"; exit 1; }

          if [ "${{ inputs.attach_theme }}" = "true" ]; then
            if grep -q '^CONFIG_PACKAGE_luci-theme-enan-dashboard=y' .config; then
              echo "✅ luci-theme-enan-dashboard enabled after defconfig." | tee -a logs/config-proof.txt
            else
              echo "::error::luci-theme-enan-dashboard missing after defconfig"
              exit 1
            fi
          fi
          exit 0

      - name: Build (sysupgrade + initramfs)
        run: |
          set +e
          make -j"$(nproc)" V=s 2>&1 | tee logs/build.log
          rc=${PIPESTATUS[0]}
          ls -l bin/targets/ath79/generic/ | tee logs/bin-list.txt
          sha256sum bin/targets/ath79/generic/*cf-wa350* 2>/dev/null | tee logs/images.sha256
          exit "$rc"

      - name: Identity card
        if: always()
        run: |
          set +e
          {
            echo "workflow       = build-cf-wa350-full v11"
            echo "output_suffix  = '${{ inputs.output_suffix }}'"
            echo "base_branch    = ${{ inputs.base_branch }} ($(git rev-parse ${{ inputs.base_branch }} 2>/dev/null || git rev-parse origin/${{ inputs.base_branch }}))"
            echo "kernel_branch  = ${{ inputs.kernel_branch }} ($(git rev-parse ${{ inputs.kernel_branch }} 2>/dev/null || git rev-parse origin/${{ inputs.kernel_branch }}))"
            echo "include_files  = ${{ inputs.include_files }}"
            echo "attach_theme   = ${{ inputs.attach_theme }}"
            echo "force_pkgs     = CONFIG_PACKAGE_lldpd=y CONFIG_PACKAGE_watchcat=y"
            echo "heads:"; cat logs/heads.txt 2>/dev/null
            echo "gates:"; cat logs/picks.txt 2>/dev/null | grep -E 'ALREADY-IN-BASE|EQUIVALENT-IN-BASE|TREE-ALREADY-IN-BASE|EMPTY-AFTER-PICK|ASSET-CONFLICT|PICKED|KERNEL-RANGE|HEAD-NOW'
            cat logs/asset-source.txt 2>/dev/null
            cat logs/variant.txt 2>/dev/null
            echo "building-helper_log:"; cat logs/building-helper.txt 2>/dev/null
            echo "config_proof:"; cat logs/config-proof.txt 2>/dev/null
            echo "kernel = 6.18$(grep -m1 'LINUX_VERSION-6.18' target/linux/generic/kernel-6.18 2>/dev/null | sed 's/.*= //')"
            echo "date   = $(date -u +%FT%TZ)"
            echo "runner = $RUNNER_NAME"
          } > logs/00-identity.txt
          cat logs/00-identity.txt
          exit 0

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cf-wa350-full-${{ inputs.dts_file }}${{ inputs.output_suffix != '' && format('-{0}', inputs.output_suffix) || '' }}-${{ github.run_number }}
          path: |
            logs/
            bin/targets/ath79/generic/*cf-wa350*
          retention-days: 30