name: Build CF-WA350 (OpenWrt 24.10.8 - stable)

on:
  workflow_dispatch:
    inputs:
      extra_config:
        description: "إضافات .config (اختياري)"
        required: false
        default: |
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y

jobs:
  build-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout OpenWrt v24.10.8 (stable release)
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: v24.10.8
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-dev python3-pyelftools rsync unzip \
            zlib1g-dev file wget swig time

      - name: Seed .config and defconfig
        env:
          EXTRA: ${{ inputs.extra_config }}
        run: |
          {
            echo "CONFIG_TARGET_ath79=y"
            echo "CONFIG_TARGET_ath79_generic=y"
            echo "CONFIG_TARGET_ath79_generic_DEVICE_comfast_cf-wa350=y"
            printf '%s\n' "$EXTRA"
          } > .config
          make defconfig
          echo "== sanity =="
          grep -E "CONFIG_TARGET_ath79_generic_DEVICE_comfast_cf-wa350|CONFIG_LINUX" .config || true

      - name: Download sources
        run: make -j"$(nproc)" download V=s

      - name: Build images
        run: |
          mkdir -p logs
          make -j"$(nproc)" V=s > logs/build.log 2>&1 || { echo "==== BUILD FAILED ===="; tail -n 200 logs/build.log; exit 1; }
          tail -n 30 logs/build.log

      - name: Record build info
        run: |
          {
            echo "base=v24.10.8 (stable)"
            echo "built_at=$(date -u +%FT%TZ)"
          } > bin/targets/ath79/generic/BUILD-INFO.txt
          ls -la bin/targets/ath79/generic/

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: cf-wa350-v24.10.8
          path: |
            bin/targets/ath79/generic/openwrt-*comfast_cf-wa350*
            bin/targets/ath79/generic/sha256sums
            bin/targets/ath79/generic/BUILD-INFO.txt

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cf-wa350-v24.10.8-log
          path: logs/build.log
          if-no-files-found: ignore
