name: patch-apply-check

on:
  workflow_dispatch:
    inputs:
      patch_ref:
        description: Ref (branch or sha) carrying the series plus the patch under test
        required: false
        default: ath79-mtd-mx25l12805d-restore-name
        type: string
      patch_path:
        description: Repo-relative path of the patch under test
        required: false
        default: target/linux/ath79/patches-6.18/740-mtd-spi-nor-macronix-restore-mx25l12805d-name.patch
        type: string
      kernel_ver:
        description: Kernel version override (empty = read include/kernel-6.18)
        required: false
        default: ""
        type: string
      fuzz_mode:
        description: strict = fuzz 0 only, defaultfuzz = GNU default only, both = two trees
        required: false
        default: both
        type: choice
        options:
          - strict
          - defaultfuzz
          - both

jobs:
  apply-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout ref under test
        uses: actions/checkout@v4
        with:
          repository: haddad2inc/openwrt
          ref: ${{ inputs.patch_ref }}
          fetch-depth: 1

      - name: Identity card
        id: id
        run: |
          set +e
          mkdir -p logs
          MM=6.18
          V="${{ inputs.kernel_ver }}"
          if [ -z "$V" ]; then
            V="$MM$(grep -m1 "^LINUX_VERSION-$MM" "include/kernel-$MM" | sed 's/.*= *//')"
          fi
          if [ -z "$V" ] || [ "$V" = "$MM" ]; then
            echo "::error::cannot resolve kernel version from include/kernel-$MM"
            exit 1
          fi
          if [ ! -f "${{ inputs.patch_path }}" ]; then
            echo "::error::patch under test not found at ${{ inputs.patch_path }}"
            exit 1
          fi
          {
            echo "ref        = ${{ inputs.patch_ref }}"
            echo "ref_sha    = $(git rev-parse HEAD)"
            echo "kernel     = $V"
            echo "patch_path = ${{ inputs.patch_path }}"
            echo "patch_sha  = $(sha256sum "${{ inputs.patch_path }}" | cut -d' ' -f1)"
            echo "fuzz_mode  = ${{ inputs.fuzz_mode }}"
            echo "date       = $(date -u +%FT%TZ)"
            echo "runner     = $RUNNER_NAME"
          } > logs/00-identity.txt
          cat logs/00-identity.txt
          echo "ver=$V" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Download pristine kernel source
        run: |
          set +e
          V="${{ steps.id.outputs.ver }}"
          mkdir -p /tmp/k && cd /tmp/k || exit 1
          ok=0
          for U in "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-$V.tar.xz" \
                   "https://mirrors.edge.kernel.org/pub/linux/kernel/v6.x/linux-$V.tar.xz" \
                   "https://sourcescdn.openwrt.org/linux-$V.tar.xz"; do
            if curl -fsSL --retry 3 --connect-timeout 20 -o linux.tar.xz "$U"; then ok=1; break; fi
          done
          if [ "$ok" != 1 ]; then echo "::error::all kernel mirrors failed for $V"; exit 1; fi
          sha256sum linux.tar.xz | tee "$GITHUB_WORKSPACE/logs/kernel-tarball.sha256"
          exit 0

      - name: Extract tree(s)
        run: |
          set +e
          cd /tmp/k || exit 1
          tar -xJf linux.tar.xz || exit 1
          mv linux-"${{ steps.id.outputs.ver }}" tree-strict || exit 1
          if [ "${{ inputs.fuzz_mode }}" = "both" ] || [ "${{ inputs.fuzz_mode }}" = "defaultfuzz" ]; then
            cp -a tree-strict tree-default || exit 1
          fi
          ls -d tree-strict tree-default 2>/dev/null
          exit 0

      - name: Build the ordered series list (OpenWrt kernel patch order)
        run: |
          set +e
          MM="$(echo '${{ steps.id.outputs.ver }}' | cut -d. -f1-2)"
          : > /tmp/k/series.txt
          for D in \
            "target/linux/generic/hack-$MM"     "target/linux/generic/hack" \
            "target/linux/generic/backport-$MM" "target/linux/generic/backport" \
            "target/linux/generic/pending-$MM"  "target/linux/generic/pending" \
            "target/linux/ath79/hack-$MM"       "target/linux/ath79/hack" \
            "target/linux/ath79/backport-$MM"   "target/linux/ath79/backport" \
            "target/linux/ath79/pending-$MM"    "target/linux/ath79/pending" \
            "target/linux/ath79/patches-$MM"    "target/linux/ath79/patches" ; do
            [ -d "$D" ] || continue
            ls "$D" 2>/dev/null | LC_ALL=C sort | grep '\.patch$' | sed "s|^|$D/|" >> /tmp/k/series.txt
          done
          cp /tmp/k/series.txt "$GITHUB_WORKSPACE/logs/series.txt"
          echo "series count: $(wc -l < /tmp/k/series.txt)"
          grep -n "$(basename '${{ inputs.patch_path }}')$" /tmp/k/series.txt > "$GITHUB_WORKSPACE/logs/patch-position.txt"
          if [ ! -s "$GITHUB_WORKSPACE/logs/patch-position.txt" ]; then
            echo "::error::patch under test not found in the series list"
            exit 1
          fi
          cat "$GITHUB_WORKSPACE/logs/patch-position.txt"
          exit 0

      - name: Apply series - strict (fuzz 0)
        if: inputs.fuzz_mode == 'strict' || inputs.fuzz_mode == 'both'
        run: |
          set +e
          LOGS="$GITHUB_WORKSPACE/logs"
          UNDER="$(basename '${{ inputs.patch_path }}')"
          cd /tmp/k/tree-strict || exit 1
          : > "$LOGS/apply-strict.log"; : > "$LOGS/apply-strict-summary.txt"
          n=0; total=$(wc -l < /tmp/k/series.txt); hard=1
          while IFS= read -r p; do
            n=$((n+1))
            if patch -p1 -f -s --fuzz=0 -i "$GITHUB_WORKSPACE/$p" >> "$LOGS/apply-strict.log" 2>&1; then
              echo "OK   $n/$total $p" >> "$LOGS/apply-strict-summary.txt"
            elif [ "$(basename "$p")" = "$UNDER" ]; then
              echo "FAIL $n/$total $p  <-- PATCH UNDER TEST" >> "$LOGS/apply-strict-summary.txt"
              hard=0
            else
              echo "SKIP $n/$total $p (pre-existing series/fuzz issue, not the patch under test)" >> "$LOGS/apply-strict-summary.txt"
            fi
          done < /tmp/k/series.txt
          echo "strict_under_ok=$hard" >> /tmp/k/results.txt
          tail -3 "$LOGS/apply-strict-summary.txt"
          exit 0

      - name: Apply series - GNU default fuzz
        if: inputs.fuzz_mode == 'defaultfuzz' || inputs.fuzz_mode == 'both'
        run: |
          set +e
          LOGS="$GITHUB_WORKSPACE/logs"
          UNDER="$(basename '${{ inputs.patch_path }}')"
          cd /tmp/k/tree-default || exit 1
          : > "$LOGS/apply-default.log"; : > "$LOGS/apply-default-summary.txt"
          n=0; total=$(wc -l < /tmp/k/series.txt); hard=1
          while IFS= read -r p; do
            n=$((n+1))
            if patch -p1 -f -s -i "$GITHUB_WORKSPACE/$p" >> "$LOGS/apply-default.log" 2>&1; then
              echo "OK   $n/$total $p" >> "$LOGS/apply-default-summary.txt"
            elif [ "$(basename "$p")" = "$UNDER tìÑ¡•¸(€€€€€€€€€€€€€€•¡¼€‰%0€‘¸¼‘Ñ½Ñ…°€‘À€€ð´´AQ U9HQMPˆ€øø€ˆ‘1=L½…ÁÁ±äµ‘•™…Õ±ÐµÍÕµµ…Éä¹ÑáÐˆ(€€€€€€€€€€€€€¡…ÉôÀ(€€€€€€€€€€€•±Í”(€€€€€€€€€€€€€•¡¼€‰M-%@€‘¸¼‘Ñ½Ñ…°€‘À€¡ÁÉ”µ•á¥ÍÑ¥¹œÍ•É¥•Ì½™Õéè¥ÍÍÕ”°¹½ÐÑ¡”Á…Ñ Õ¹‘•ÈÑ•ÍÐ¤ˆ€øø€ˆ‘1=L½…ÁÁ±äµ‘•™…Õ±ÐµÍÕµµ…Éä¹ÑáÐˆ(€€€€€€€€€€€™¤(€€€€€€€€€‘½¹”€ð€½ÑµÀ½¬½Í•É¥•Ì¹ÑáÐ(€€€€€€€€€•¡¼€‰‘•™…Õ±Ñ}Õ¹‘•É}½¬ô‘¡…Éˆ€øø€½ÑµÀ½¬½É•ÍÕ±ÑÌ¹ÑáÐ(€€€€€€€€€Ñ…¥°€´Ì€ˆ‘1=L½…ÁÁ±äµ‘•™…Õ±ÐµÍÕµµ…Éä¹ÑáÐˆ(€€€€€€€€€•á¥Ð€À((€€€€€€´¹…µ”è…Ñ•Ì(€€€€€€€ÉÕ¸èð(€€€€€€€€€Í•Ð€­”(€€€€€€€€€1=Lôˆ‘%Q!U	}]=I-MA½±½Ìˆ(€€€€€€€€€U9I}AQ ôˆ‘íì¥¹ÁÕÑÌ¹Á…Ñ¡}Á…Ñ õôˆ(€€€€€€€€€™…¥°ôÀ(€€€€€€€€€ÍÉ™¥±”ôˆ¡É•À€µ´Ä€x¬¬¬ˆ¼œ€ˆ‘U9I}AQ ˆðÕÐ€µŒÜ´¤ˆ(€€€€€€€€€•¡¼€‰Á…Ñ¡•™¥±”€ô€‘ÍÉ™¥±”ˆðÑ•”€ˆ‘1=L½Á…Ñ¡•µ™¥±”¹ÑáÐˆ(€€€€€€€€€É•À€x¬œ€ˆ‘U9I}AQ ˆðÉ•À€µØ€x¬¬¬œðÍ•€Ì½x¬¼¼œðÉ•À€µØ€ymléÍÁ…”éut¨œ€ø€½ÑµÀ½¬½…‘‘•¹ÑáÐ(€€€€€€€€€Ý¡¥±”%LôÉ•…€µÈ°ì‘¼(€€€€€€€€€€€¥˜É•À€µÅ€ˆ‘°ˆ€ˆ½ÑµÀ½¬½ÑÉ•”µÍÑÉ¥Ð¼‘ÍÉ™¥±”ˆìÑ¡•¸(€€€€€€€€€€€€€•¡¼€‰ÁÉ•Í•¹Ðè€‘°ˆ(€€€€€€€€€€€•±Í”(€€€€€€€€€€€€€•¡¼€ˆèé•ÉÉ½Èèé…‘‘•±¥¹”µ¥ÍÍ¥¹œ…™Ñ•È…ÁÁ±äè€‘°ˆ(€€€€€€€€€€€€€™…¥°ôÄ(€€€€€€€€€€€™¤(€€€€€€€€€‘½¹”€ð€½ÑµÀ½¬½…‘‘•¹ÑáÐ(€€€€€€€€€™½ÈP¥¸ÑÉ•”µÍÑÉ¥ÐÑÉ•”µ‘•™…Õ±Ðì‘¼(€€€€€€€€€€€l€µ€ˆ½ÑµÀ½¬¼‘Pˆtñð½¹Ñ¥¹Õ”(€€€€€€€€€€€Hôˆ¡™¥¹€½ÑµÀ½¬¼‘P€µ¹…µ”€œ¨¹É•¨œ€µ¼€µ¹…µ”€œ¨¹½É¥œœð¡•…€´Ô¤ˆ(€€€€€€€€€€€¥˜l€µ¸€ˆ‘HˆtìÑ¡•¸(€€€€€€€€€€€€€•¡¼€ˆèé•ÉÉ½Èèé±•™Ñ½Ù•ÈÉ•©•Ð™¥±•Ì¥¸€‘Pè€‘Hˆ(€€€€€€€€€€€€€•¡¼€ˆ‘Hˆ€ø€ˆ‘1=L½É•¨´‘P¹ÑáÐˆ(€€€€€€€€€€€€€™…¥°ôÄ(€€€€€€€€€€€™¤(€€€€€€€€€‘½¹”(€€€€€€€€€¥˜l€ˆ‘íì¥¹ÁÕÑÌ¹™Õéé}µ½‘”õôˆ€„ô€‰‘•™…Õ±Ñ™ÕéèˆtìÑ¡•¸(€€€€€€€€€€€É•À€µÄ€ÍÑÉ¥Ñ}Õ¹‘•É}½¬ôÄœ€½ÑµÀ½¬½É•ÍÕ±ÑÌ¹ÑáÐñðì•¡¼€ˆèé•ÉÉ½ÈèéÍÑÉ¥ÐÁ…ÍÌ™…¥±•½¸Ñ¡”Á…Ñ Õ¹‘•ÈÑ•ÍÐˆì™…¥°ôÄìô(€€€€€€€€€™¤(€€€€€€€€€¥˜l€ˆ‘íì¥¹ÁÕÑÌ¹™Õéé}µ½‘”õôˆ€„ô€‰ÍÑÉ¥ÐˆtìÑ¡•¸(€€€€€€€€€€€É•À€µÄ€‘•™…Õ±Ñ}Õ¹‘•É}½¬ôÄœ€½ÑµÀ½¬½É•ÍÕ±ÑÌ¹ÑáÐñðì•¡¼€ˆèé•ÉÉ½Èèé‘•™…Õ±Ðµ™ÕéèÁ…ÍÌ™…¥±•½¸Ñ¡”Á…Ñ Õ¹‘•ÈÑ•ÍÐˆì™…¥°ôÄìô(€€