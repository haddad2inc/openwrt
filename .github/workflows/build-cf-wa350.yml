name: Build CF-WA350 image

# ============================================================================
# workflow اختباري (فرع ci-wa350 فقط — لا يلمس فرع الـ PR ولا يغيّره).
# يبني صورة sysupgrade + initramfs لجهاز COMFAST CF-WA350 من أي ref تختاره:
#   * رأس الـ PR الحالي: 949b9f785c85b32c8daa3acfb9ccd01ce221cae1
#   * رأس 13 سبتمبر (آخر عهد hw_margin_ms=1000): 3c80ef2c5bc5f1afc8698ae3e52cbcda4321d8bd
#   * رأس 13 سبتمبر ليلًا (أول hw_margin_ms=500): 00be69e9b96731d9898419754f236cc248002524
#   * رأس 11 سبتمبر (حقبة النسخة العاملة): b4c5ac2908fd6ee0045a5c9a2ac5f07375c4a801
# البيئة: ubuntu-24.04 نظيفة تمامًا — تلغي متغير "بيئة البناء المحلية" بالكامل.
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "الـ ref المراد بناؤه (sha كامل أو اسم فرع)"
        required: true
        default: "949b9f785c85b32c8daa3acfb9ccd01ce221cae1"
      extra_config:
        description: "أسطر .config إضافية (سطر لكل خيار)"
        required: false
        default: |
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y

jobs:
  build-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-dev python3-pyelftools rsync unzip \
            zlib1g-dev file wget swig time

      - name: Seed .config and defconfig
        env:
          EXTRA: ${{ inputs.extra_config }}
        run: |
          {
            echo "CONFIG_TARGET_ath79=y"
            echo "CONFIG_TARGET_ath79_generic=y"
            echo "CONFIG_TARGET_ath79_generic_DEVICE_comfast_cf-wa350=y"
            printf '%s\n' "$EXTRA"
          } > .config
          make defconfig
          echo "== sanity =="
          grep -E "CONFIG_TARGET_ath79_generic_DEVICE_comfast_cf-wa350|CONFIG_PACKAGE_cfw-leds|CONFIG_PACKAGE_kmod-dsa-qca8k|CONFIG_PACKAGE_swconfig" .config || true

      - name: Download sources
        run: make -j"$(nproc)" download V=s

      - name: Build images
        run: |
          mkdir -p logs
          make -j"$(nproc)" V=s > logs/build.log 2>&1 || { echo "==== BUILD FAILED — last 200 lines ===="; tail -n 200 logs/build.log; exit 1; }
          tail -n 30 logs/build.log

      - name: Record build info
        run: |
          {
            echo "git_ref=${{ inputs.git_ref }}"
            echo "head_sha=$(git rev-parse HEAD)"
            echo "run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "built_at=$(date -u +%FT%TZ)"
            cat bin/targets/ath79/generic/version.buildinfo 2>/dev/null || true
          } > bin/targets/ath79/generic/BUILD-INFO.txt
          ls -la bin/targets/ath79/generic/
          (cd bin/targets/ath79/generic && sha256sum *.bin 2>/dev/null || true)

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: cf-wa350-run${{ github.run_number }}
          path: |
            bin/targets/ath79/generic/openwrt-*comfast_cf-wa350*
            bin/targets/ath79/generic/sha256sums
            bin/targets/ath79/generic/BUILD-INFO.txt
            bin/targets/ath79/generic/config.buildinfo

      - name: Upload build log (on demand)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cf-wa350-run${{ github.run_number }}-log
          path: logs/build.log
          if-no-files-found: ignore
