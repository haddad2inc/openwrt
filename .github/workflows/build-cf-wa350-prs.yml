name: build-cf-wa350-prs

# v12 (2026-10-22) - a SEPARATE workflow. `build-cf-wa350-full` / `-final` are untouched.
#
# Purpose: build the image that is actually going to be merged, out of the OFFICIAL PR branches
# only. No test branch (k1-qca8k-*), no extra build branch, and NO per-PR switches: every branch
# and its whole commit range is hardcoded below, because the build always wants all of them.
# The only input left is asset_profile, which replaces include_files/attach_theme with the exact
# logic of build-cf-wa350-final (main -> m/, general -> g/, special -> s/).
#
# What is assembled (all ranges measured against UPSTREAM MASTER, see below):
#   base_branch   comfast-cf-wa350-support           = PR #25040 device commit (DTS + 01_leds +
#                                                      02_network + image/generic.mk) - so the DTS
#                                                      comes from #25040 itself and needs no asset
#                                                      copy, no sha256 pin and no variant table.
#   PR #25760     generic-leds-wired-rate-activity    3 commits: 744 qca8k cached stats64 +
#                                                      706/0956 refreshes, 835 netdev rate_threshold,
#                                                      base-files init.d/led default
#   PR #25761     mac80211-tpt-led-delivered-idle     2 commits: subsys/423 delivered-data tpt +
#                                                      subsys/424 solid below idle + PKG_RELEASE bump
#   PR #25474     ath79-mtd-mx25l12805d-restore-name  1 commit: patch 460
#   PR #25477     ath79-ar8216-internal-mdio          1 commit: patch 731
#   PR #25040     comfast-cf-wa350-support            1 commit (ALREADY-IN-BASE when it is the base)
#   ci-wa350      .config asset only
#   building-helper  <profile>/{files,luci-theme-enan-dashboard}
#
# Why the ranges are measured against upstream master and not against base_branch (v9 post-mortem):
# the PR branches are based on openwrt/master while comfast-cf-wa350-support sits on an older
# master, so merge-base(base_branch, pr_branch) is that older master and the range swallows every
# master commit in between - measured on the v9 run as 75 picks instead of 3
# (compare de24245e0834...22aa500f7413 => ahead_by=72). Against upstream master the range is
# exactly the PR's own commits, whatever the base branch sits on. The number the old method would
# have produced is still printed on every run as `<PR>-NOT-USED ... range-would-be=N`.
#
# Gates - the run dies BEFORE building if any fails, and every result lands on the identity card:
#   G1 COUNT   1 <= commits <= the hardcoded ceiling (#25760: 3, #25761: 2, others: 1)
#   G2 SHAPE   per-commit file list is printed; an EMPTY commit fails (the 42a3f77 defect,
#              caught by PR #25760 review 5561299779)
#   G3 BLOB    ADDED files must equal the published PR blob byte-for-byte:
#              25760: 744=9331caa39d24 835=7e1999cf515a
#              25761: subsys/423=570e0f5a947b subsys/424=6be1ded07f56
#              25474: 460=1902e73e2f3c  25477: 731=4a4f8743489c
#   G4 MARKER  MODIFIED files are gated on a content marker, not a blob (master drift may merge in,
#              which prints BLOB-DIFF as a warning instead of failing):
#              706 "@@ -478,6 +530,10 @@"   0956 "@@ -2137,6 +2179,7 @@"
#              init.d/led "rate_threshold"  mac80211/Makefile "PKG_RELEASE:=6"
#              01_leds "cf-wa350"           image/generic.mk "comfast_cf-wa350"
#   G5 DTS     present and carrying `comfast,cf-wa350` - NO sha256 pin, because it is #25040's own file
#   plus the six pick() gates inherited from v8 (ALREADY-IN-BASE / EQUIVALENT-IN-BASE /
#   TREE-ALREADY-IN-BASE / PARTIAL-CONTENT-IN-BASE / EMPTY-AFTER-PICK / ASSET-CONFLICT /
#   hard conflict with logs/conflict-<label>.txt uploaded as an artifact).

on:
  workflow_dispatch:
    inputs:
      asset_profile:
        description: 'Asset profile to import (m/g/s folder from building-helper)'
        required: true
        default: main
        type: choice
        options:
          - main
          - general
          - special

env:
  BUILDING_HELPER_REPO: https://github.com/haddad2inc/building-helper.git
  UPSTREAM_REPO: https://github.com/openwrt/openwrt.git
  BASE_BRANCH: comfast-cf-wa350-support
  BR_25760: generic-leds-wired-rate-activity
  BR_25761: mac80211-tpt-led-delivered-idle
  BR_25474: ath79-mtd-mx25l12805d-restore-name
  BR_25477: ath79-ar8216-internal-mdio
  MAX_25760: "3"
  MAX_25761: "2"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: "Checkout base branch (PR #25040 head)"
        uses: actions/checkout@v4
        with:
          repository: haddad2inc/openwrt
          ref: comfast-cf-wa350-support
          fetch-depth: 0

      - name: Fetch upstream master + the five PR branches
        run: |
          set +e
          mkdir -p logs
          # the PR ranges are measured against upstream master, so it must be present
          git fetch --quiet "$UPSTREAM_REPO" master || { echo "::error::fetch upstream master failed"; exit 1; }
          UPMASTER="$(git rev-parse FETCH_HEAD)"
          git fetch origin main \
                           "$BR_25760" \
                           "$BR_25761" \
                           "$BR_25474" \
                           "$BR_25477" \
                           comfast-cf-wa350-support || { echo "::error::fetch branches failed"; exit 1; }
          {
            echo "base_branch    = comfast-cf-wa350-support $(git rev-parse HEAD)"
            echo "upstream_master= $UPMASTER ($UPSTREAM_REPO)"
            echo "PR-25760 branch= $BR_25760 $(git rev-parse origin/$BR_25760)"
            echo "PR-25761 branch= $BR_25761 $(git rev-parse origin/$BR_25761)"
            echo "PR-25474 head  = $(git rev-parse origin/$BR_25474)"
            echo "PR-25477 head  = $(git rev-parse origin/$BR_25477)"
            echo "PR-25040 head  = $(git rev-parse origin/comfast-cf-wa350-support)"
            echo "fork main      = $(git rev-parse origin/main)"
            echo "asset_profile  = ${{ inputs.asset_profile }}"
          } | tee logs/heads.txt
          echo "UPMASTER=$UPMASTER" >> "$GITHUB_ENV"
          exit 0

      - name: Cherry-pick the five PR ranges (measured against upstream master)
        run: |
          set +e
          git config user.name "haddad2inc"
          git config user.email "haddad2inc@gmail.com"
          : > logs/picks.txt
          BASE_SHA="$(git rev-parse HEAD)"
          ASSET_DTS="target/linux/ath79/dts/qca9563_comfast_cf-wa350.dts"

          log() { echo "$1" | tee -a logs/picks.txt; }

          # gate 3 (v8): blob-level state of everything the commit touches, versus HEAD.
          #   0 = every touched blob already byte-identical at HEAD  1 = some  2 = none
          content_state() {
            local m1 m2 s1 s2 st p1 p2 same=0 diff=0
            while read -r m1 m2 s1 s2 st p1 p2; do
              [ -n "$st" ] || continue
              case "$st" in
                D*) if git rev-parse -q --verify "HEAD:$p1" >/dev/null; then diff=$((diff+1)); else same=$((same+1)); fi ;;
                *)  [ -n "$p2" ] || p2="$p1"
                    if [ "$s2" != "0000000000000000000000000000000000000000" ] \
                       && [ "$(git rev-parse -q --verify "HEAD:$p2" 2>/dev/null)" = "$s2" ]; then
                      same=$((same+1))
                    else
                      diff=$((diff+1))
                    fi ;;
              esac
            done < <(git show --no-color --no-abbrev --format= --raw -m --first-parent --find-renames "$1")
            [ "$same" -gt 0 ] && [ "$diff" -eq 0 ] && return 0
            [ "$same" -gt 0 ] && return 1
            return 2
          }

          pick() {
            local ref="$1" label="$2" sha
            sha="$(git rev-parse "$ref")" || { echo "::error::$label: cannot resolve $ref"; exit 1; }
            if git merge-base --is-ancestor "$sha" HEAD; then
              log "ALREADY-IN-BASE $label $sha"
              return 0
            fi
            if git cherry HEAD "$sha" 2>/dev/null | grep -q "^- $sha"; then
              log "EQUIVALENT-IN-BASE $label $sha (patch-id match; rebased/re-signed twin)"
              return 0
            fi
            content_state "$sha"; cs=$?
            if [ "$cs" -eq 0 ]; then
              log "TREE-ALREADY-IN-BASE $label $sha (every touched blob identical at HEAD)"
              return 0
            fi
            [ "$cs" -eq 1 ] && log "PARTIAL-CONTENT-IN-BASE $label $sha (some blobs already identical; picking the rest)"
            local out rc
            out="$(git cherry-pick -x "$sha" 2>&1)"
            rc=$?
            printf '%s\n' "$out" >> logs/picks.txt
            if [ "$rc" -eq 0 ]; then
              log "PICKED $label $sha"
              return 0
            fi
            if { printf '%s' "$out" | grep -qi 'now empty'; } \
               || { ! git rev-parse -q --verify CHERRY_PICK_HEAD >/dev/null \
                    && git diff-index --quiet HEAD -- 2>/dev/null \
                    && [ -z "$(git diff --name-only --diff-filter=U)" ]; }; then
              git cherry-pick --skip >/dev/null 2>&1 || git cherry-pick --quit >/dev/null 2>&1
              log "EMPTY-AFTER-PICK $label $sha (change already present; skipped, nothing lost)"
              return 0
            fi
            UNMERGED="$(git diff --name-only --diff-filter=U)"
            if [ -n "$UNMERGED" ] && [ "$UNMERGED" = "$ASSET_DTS" ]; then
              git checkout --ours -- "$ASSET_DTS" 2>/dev/null && git add -- "$ASSET_DTS"
              if git diff --cached --quiet HEAD 2>/dev/null; then
                git cherry-pick --skip >/dev/null 2>&1 || git cherry-pick --quit >/dev/null 2>&1
                log "ASSET-CONFLICT-EMPTY $label $sha (only the DTS conflicted; remainder already in base - skipped)"
                return 0
              elif GIT_EDITOR=true git cherry-pick --continue >/dev/null 2>&1; then
                log "ASSET-CONFLICT-RESOLVED $label $sha (only the DTS conflicted; base kept - the DTS comes from PR #25040)"
                return 0
              fi
              log "ASSET-CONFLICT-RESOLVE-FAILED $label $sha (falling through to hard fail)"
            fi
            {
              echo "=== $label $sha ==="
              printf '%s\n' "$out"
              echo "--- git status --porcelain ---"
              git status --porcelain
              echo "--- unmerged files ---"
              git diff --name-only --diff-filter=U
              for f in $(git diff --name-only --diff-filter=U); do
                echo "--- diff HEAD..$sha -- $f ---"
                git diff "HEAD..$sha" -- "$f"
              done
            } > "logs/conflict-$label.txt" 2>&1
            echo "::error::cherry-pick conflict in $label ($sha) - see artifact logs/conflict-$label.txt"
            cat "logs/conflict-$label.txt"
            git cherry-pick --abort
            exit 1
          }

          # ------------------------------------------------------------------
          # G1 count + G2 shape, then the picks. One function for all five PRs.
          # ------------------------------------------------------------------
          pr_range() {
            local br="$1" label="$2" max="$3" ref UMB N i=0 c nf files
            ref="origin/$br"
            git rev-parse -q --verify "$ref" >/dev/null || { echo "::error::$label: no such branch $br"; exit 1; }
            UMB="$(git merge-base "$UPMASTER" "$ref")" || { echo "::error::$label: merge-base with upstream master failed"; exit 1; }
            N="$(git rev-list --count "$UMB..$ref")"
            log "$label-RANGE $ref upstream-merge-base=$UMB commits=$N max=$max"
            log "$label-NOT-USED merge-base(base_branch,$ref)=$(git merge-base "$BASE_SHA" "$ref") range-would-be=$(git rev-list --count "$(git merge-base "$BASE_SHA" "$ref")..$ref") (the old method, which also picked master drift)"
            if [ "$N" -lt 1 ]; then echo "::error::$label-RANGE-EMPTY: nothing above the upstream merge-base"; exit 1; fi
            if [ "$N" -gt "$max" ]; then
              echo "::error::$label-RANGE too wide: $N commits > max $max - the branch is not what the identity card claims; refusing to build"
              git log --oneline "$UMB..$ref" | head -20
              exit 1
            fi
            for c in $(git rev-list --reverse "$UMB..$ref"); do
              i=$((i+1))
              nf="$(git diff-tree -r --no-commit-id --name-only "$c" | grep -c .)"
              files="$(git diff-tree -r --no-commit-id --name-only "$c" | tr '\n' ' ')"
              log "$label-C$i $(git log -1 --format=%h "$c") files=$nf subj=$(git log -1 --format=%s "$c" | cut -c1-58)"
              log "$label-C$i-PATHS $files"
              if [ "$nf" -lt 1 ]; then
                echo "::error::$label commit $c is EMPTY - the commit split is broken (cf. PR #25760 review 5561299779); refusing to build"
                exit 1
              fi
            done
            for c in $(git rev-list --reverse "$UMB..$ref"); do
              pick "$c" "$label-$(git log -1 --format=%h "$c")"
            done
          }

          # G3: ADDED files must equal the published PR blob byte-for-byte.
          blob_gate() {
            local label="$1" path="$2" want="$3" got
            got="$(git rev-parse -q --verify "HEAD:$path" >/dev/null 2>&1 && git rev-parse "HEAD:$path" || echo ABSENT)"
            if [ "$got" = "$want" ]; then log "BLOB-OK $label $got"
            else log "BLOB-BAD $label got=$got want=$want"; GATE_FAIL=1; fi
          }
          # G4: MODIFIED files are gated on a content marker; a blob difference is a warning.
          marker_gate() {
            local label="$1" path="$2" want="$3" marker="$4" got
            got="$(git rev-parse -q --verify "HEAD:$path" >/dev/null 2>&1 && git rev-parse "HEAD:$path" || echo ABSENT)"
            if [ "$got" = ABSENT ]; then log "MARKER-BAD $label $path ABSENT"; GATE_FAIL=1; return; fi
            if git show "HEAD:$path" | grep -qF -- "$marker"; then
              log "MARKER-OK $label ($marker)"
            else
              log "MARKER-BAD $label marker '$marker' not in $path"; GATE_FAIL=1
            fi
            [ "$got" = "$want" ] && log "BLOB-OK $label $got" || log "BLOB-DIFF $label got=$got want=$want (master drift merged into a modified file - the marker is the gate)"
          }

          GATE_FAIL=0
          pr_range comfast-cf-wa350-support PR-25040 1
          marker_gate 25040/01_leds   target/linux/ath79/generic/base-files/etc/board.d/01_leds 5772cb61da442bbf092eb1da82b3e5c924a35d06 'cf-wa350'
          marker_gate 25040/generic.mk target/linux/ath79/image/generic.mk bdc570e39385cc9abbce80376a74d41706368ab2 'comfast_cf-wa350'

          pr_range "$BR_25760" PR-25760 "$MAX_25760"
          blob_gate   25760/744 target/linux/generic/pending-6.18/744-net-dsa-qca8k-cached-mib-stats64.patch 9331caa39d247618513a6c7f0a8d909587554444
          blob_gate   25760/835 target/linux/generic/pending-6.18/835-leds-trigger-netdev-add-byte-rate-threshold-mode.patch 7e1999cf515aeb5531a262ec641c27e3eed4ba0c
          marker_gate 25760/706 target/linux/ipq40xx/patches-6.18/706-net-dsa-qca8k-add-IPQ4019-built-in-switch-support.patch 32dfc2130afee4cab0a9adc7490c16564978bcb7 '@@ -478,6 +530,10 @@'
          marker_gate 25760/0956 target/linux/qualcommax/patches-6.18/0956-net-dsa-qca8k-support-the-qca-etype-tagging-protocol.patch fac16dcaa92509dc231949eaaecf5b1447cf5ea1 '@@ -2137,6 +2179,7 @@'
          marker_gate 25760/led package/base-files/files/etc/init.d/led 911bd155f436d11116e397492f5b2f96cd1e5467 'rate_threshold'

          pr_range "$BR_25761" PR-25761 "$MAX_25761"
          blob_gate   25761/423 package/kernel/mac80211/patches/subsys/423-wifi-mac80211-count-tpt-led-trigger-from-delivered-data.patch 570e0f5a947b645ee09361dcb5eb17908cd68b37
          blob_gate   25761/424 package/kernel/mac80211/patches/subsys/424-wifi-mac80211-keep-tpt-led-solid-below-idle-threshold.patch 6be1ded07f56134483a2856180c7d516cf418ba6
          marker_gate 25761/Makefile package/kernel/mac80211/Makefile 9d7b0f98fb5cad1fa095357064a99c2c5583e90f 'PKG_RELEASE:=6'

          pr_range "$BR_25474" PR-25474 1
          blob_gate 25474/460 target/linux/ath79/patches-6.18/460-mtd-spi-nor-macronix-restore-mx25l12805d-name.patch 1902e73e2f3cbd7598319d2252d3c7e118a49bf1

          pr_range "$BR_25477" PR-25477 1
          blob_gate 25477/731 target/linux/ath79/patches-6.18/731-ar8216-skip-phys-on-switch-internal-mdio-bus.patch 4a4f8743489c480c3ec264f00db480fd364d253b

          # G5: the DTS comes from PR #25040 itself - presence only, no sha256 pin.
          if [ -s "$ASSET_DTS" ] && grep -qF 'comfast,cf-wa350' "$ASSET_DTS"; then
            log "DTS-OK $ASSET_DTS ($(wc -l < "$ASSET_DTS") lines, sha256 $(sha256sum "$ASSET_DTS" | cut -c1-16)… recorded, not pinned)"
          else
            log "DTS-BAD $ASSET_DTS missing or does not mention cf-wa350"; GATE_FAIL=1
          fi

          if [ "$GATE_FAIL" != 0 ]; then
            echo "::error::a content gate failed (BLOB-BAD / MARKER-BAD / DTS-BAD above) - the image would not carry the published PR content"
            exit 1
          fi
          log "CONTENT-GATES-OK"
          log "HEAD-NOW $(git rev-parse HEAD) (base was $BASE_SHA)"
          git log --oneline "$BASE_SHA..HEAD" | tee -a logs/picks.txt
          exit 0

      - name: "Pull .config asset from ci-wa350 (the DTS comes from PR #25040, not from an asset)"
        run: |
          set +e
          git fetch --depth 1 origin ci-wa350 || exit 1
          mkdir -p /tmp/assets
          git show "origin/ci-wa350:.config" > /tmp/assets/.config || exit 1
          { echo "cfg_source = ci-wa350"; echo "dts_source = PR #25040 (in-tree, no asset copy, no sha pin)"; } | tee logs/asset-source.txt
          sha256sum /tmp/assets/.config | tee logs/assets.sha256
          exit 0

      # =====================================================================
      # profile-driven asset import (main -> m/, general -> g/, special -> s/)
      # verbatim logic of build-cf-wa350-final; replaces include_files/attach_theme
      # =====================================================================
      - name: Import assets from building-helper (profile-driven)
        run: |
          set +e
          echo "=== Importing assets (profile=${{ inputs.asset_profile }}) ===" | tee logs/building-helper.txt
          BH_DIR="/tmp/building-helper"
          rm -rf "$BH_DIR"
          if git clone --depth 1 "$BUILDING_HELPER_REPO" "$BH_DIR" 2>&1 | tee -a logs/building-helper.txt; then
            echo "✅ building-helper clone succeeded." | tee -a logs/building-helper.txt
          else
            echo "::error::building-helper clone FAILED."
            exit 1
          fi
          rm -rf "$BH_DIR/.git"
          echo "=== Contents of building-helper (top-level) ===" | tee -a logs/building-helper.txt
          ls -la "$BH_DIR" | tee -a logs/building-helper.txt

          case "${{ inputs.asset_profile }}" in
            main)    SUB=m ;;
            general) SUB=g ;;
            special) SUB=s ;;
            *)       echo "::error::unknown asset_profile '${{ inputs.asset_profile }}'"; exit 1 ;;
          esac
          SRC="$BH_DIR/$SUB"
          echo "=== Selected subfolder: $SRC ===" | tee -a logs/building-helper.txt
          if [ ! -d "$SRC" ]; then
            echo "::error::asset_profile '${{ inputs.asset_profile }}' → $SRC not found in building-helper."
            ls -la "$BH_DIR" | tee -a logs/building-helper.txt
            exit 1
          fi

          if [ -d "$SRC/files" ]; then
            mkdir -p files
            cp -rv "$SRC/files"/. files/ 2>&1 | tee -a logs/building-helper.txt
            echo "✅ files/ injected from $SUB/files" | tee -a logs/building-helper.txt
            find files -maxdepth 4 -type f | sort | tee -a logs/building-helper.txt
          else
            echo "ℹ️ $SRC/files not present — skipping files overlay." | tee -a logs/building-helper.txt
          fi

          if [ -d "$SRC/luci-theme-enan-dashboard" ]; then
            TARGET_PARENT="package"
            TARGET_DIR="$TARGET_PARENT/luci-theme-enan-dashboard"
            mkdir -p "$TARGET_PARENT"
            rm -rf "$TARGET_DIR"
            cp -rv "$SRC/luci-theme-enan-dashboard" "$TARGET_PARENT"/ 2>&1 | tee -a logs/building-helper.txt
            chmod -R u+rwX,go+rX "$TARGET_DIR" 2>&1 | tee -a logs/building-helper.txt
            find "$TARGET_DIR" -type f -name "*.sh" -exec chmod +x {} \; 2>&1 | tee -a logs/building-helper.txt
            find "$TARGET_DIR" -type f -name "Makefile" -exec chmod 644 {} \; 2>&1 | tee -a logs/building-helper.txt
            find "$TARGET_DIR/files" -type f -exec chmod +x {} \; 2>/dev/null || true
            if [ -f "$TARGET_DIR/Makefile" ]; then
              echo "✅ luci-theme-enan-dashboard imported from $SUB/luci-theme-enan-dashboard" | tee -a logs/building-helper.txt
              head -n 20 "$TARGET_DIR/Makefile" | tee -a logs/building-helper.txt
            else
              echo "::error::Makefile NOT found in $TARGET_DIR"
              exit 1
            fi
          else
            echo "ℹ️ $SRC/luci-theme-enan-dashboard not present — skipping theme package." | tee -a logs/building-helper.txt
          fi

          echo "=== Import completed for profile '${{ inputs.asset_profile }}' ===" | tee -a logs/building-helper.txt
          exit 0

      # =====================================================================
      # .config finalisation: luci always on, theme only if the profile provided
      # it, lldpd/watchcat hard-forced before AND after defconfig.
      # =====================================================================
      - name: Config from root .config + luci + lldpd/watchcat + defconfig + proofs
        run: |
          set +e
          cp /tmp/assets/.config .config
          sed -i 's/^# CONFIG_PACKAGE_luci is not set/CONFIG_PACKAGE_luci=y/' .config
          if [ -d "package/luci-theme-enan-dashboard" ]; then
            echo "--- Injecting CONFIG_PACKAGE_luci-theme-enan-dashboard=y ---" | tee -a logs/building-helper.txt
            sed -i '/^CONFIG_PACKAGE_luci-theme-enan-dashboard=/d' .config
            sed -i '/^# CONFIG_PACKAGE_luci-theme-enan-dashboard is not set/d' .config
            echo 'CONFIG_PACKAGE_luci-theme-enan-dashboard=y' >> .config
          fi
          force_enable_pre() {
            local sym="$1"
            echo "--- Force-enabling ${sym}=y (pre-defconfig) ---" | tee -a logs/config-proof.txt
            sed -i "/^${sym}=/d"                     .config
            sed -i "/^# ${sym} is not set/d"         .config
            echo "${sym}=y" >> .config
          }
          force_enable_pre "CONFIG_PACKAGE_lldpd"
          force_enable_pre "CONFIG_PACKAGE_watchcat"
          ./scripts/feeds update -a >/dev/null 2>&1
          ./scripts/feeds install -a >/dev/null 2>&1
          make defconfig || exit 1
          need_redefconfig=0
          force_enable_post() {
            local sym="$1"
            if grep -q "^${sym}=y" .config; then
              echo "✅ ${sym}=y survived defconfig." | tee -a logs/config-proof.txt
              return 0
            fi
            echo "⚠️ ${sym} not =y after defconfig → re-forcing." | tee -a logs/config-proof.txt
            sed -i "/^${sym}=/d"             .config
            sed -i "/^# ${sym} is not set/d" .config
            echo "${sym}=y" >> .config
            need_redefconfig=1
          }
          force_enable_post "CONFIG_PACKAGE_lldpd"
          force_enable_post "CONFIG_PACKAGE_watchcat"
          if [ "$need_redefconfig" -eq 1 ]; then
            echo "--- Re-running defconfig to merge re-forced lldpd/watchcat ---" | tee -a logs/config-proof.txt
            make defconfig || exit 1
            if ! grep -q '^CONFIG_PACKAGE_lldpd=y' .config || \
               ! grep -q '^CONFIG_PACKAGE_watchcat=y' .config; then
              echo "::error::defconfig refuses to keep lldpd/watchcat=y - dependencies likely missing on this branch"
              grep -E 'lldpd|watchcat' .config | tee -a logs/config-proof.txt
              exit 1
            fi
          fi
          grep -E '^CONFIG_TARGET_PROFILE=|^CONFIG_PACKAGE_kmod-dsa-qca8k=|^CONFIG_TARGET_ROOTFS_INITRAMFS=|^CONFIG_GCC_VERSION=|^CONFIG_PACKAGE_luci=|^CONFIG_PACKAGE_ethtool=|^CONFIG_PACKAGE_luci-theme-enan-dashboard=|^CONFIG_PACKAGE_lldpd=|^CONFIG_PACKAGE_watchcat=' .config | tee -a logs/config-proof.txt
          grep -q '^CONFIG_PACKAGE_luci=y'     .config || { echo "::error::luci missing after defconfig";     exit 1; }
          grep -q '^CONFIG_PACKAGE_lldpd=y'    .config || { echo "::error::lldpd missing after defconfig";    exit 1; }
          grep -q '^CONFIG_PACKAGE_watchcat=y' .config || { echo "::error::watchcat missing after defconfig"; exit 1; }
          if [ -d "package/luci-theme-enan-dashboard" ]; then
            if grep -q '^CONFIG_PACKAGE_luci-theme-enan-dashboard=y' .config; then
              echo "✅ luci-theme-enan-dashboard enabled after defconfig." | tee -a logs/config-proof.txt
            else
              echo "::error::luci-theme-enan-dashboard missing after defconfig"
              exit 1
            fi
          fi
          exit 0

      - name: Build (sysupgrade + initramfs)
        run: |
          set +e
          make -j"$(nproc)" V=s 2>&1 | tee logs/build.log
          rc=${PIPESTATUS[0]}
          ls -l bin/targets/ath79/generic/ | tee logs/bin-list.txt
          sha256sum bin/targets/ath79/generic/*cf-wa350* 2>/dev/null | tee logs/images.sha256
          exit "$rc"

      - name: Identity card
        if: always()
        run: |
          set +e
          {
            echo "workflow       = build-cf-wa350-prs v12"
            echo "asset_profile  = ${{ inputs.asset_profile }}"
            echo "base_branch    = comfast-cf-wa350-support ($(git rev-parse origin/comfast-cf-wa350-support))"
            echo "upstream_master= $UPMASTER"
            echo "pr_branches    = $BR_25760 (max $MAX_25760) / $BR_25761 (max $MAX_25761) / $BR_25474 (1) / $BR_25477 (1) / comfast-cf-wa350-support (1)"
            echo "dts_source     = PR #25040 (in-tree; no asset copy, no sha256 pin)"
            echo "force_pkgs     = CONFIG_PACKAGE_lldpd=y CONFIG_PACKAGE_watchcat=y"
            echo "heads:"; cat logs/heads.txt 2>/dev/null
            echo "gates:"; cat logs/picks.txt 2>/dev/null | grep -E 'ALREADY-IN-BASE|EQUIVALENT-IN-BASE|TREE-ALREADY-IN-BASE|PARTIAL-CONTENT|EMPTY-AFTER-PICK|ASSET-CONFLICT|BLOB-OK|BLOB-BAD|BLOB-DIFF|MARKER-OK|MARKER-BAD|DTS-OK|DTS-BAD|CONTENT-GATES-OK|PICKED|-RANGE|-NOT-USED|-C[0-9]|HEAD-NOW'
            cat logs/asset-source.txt 2>/dev/null
            echo "building-helper_log:"; cat logs/building-helper.txt 2>/dev/null
            echo "config_proof:"; cat logs/config-proof.txt 2>/dev/null
            echo "kernel = 6.18$(grep -m1 'LINUX_VERSION-6.18' target/linux/generic/kernel-6.18 2>/dev/null | sed 's/.*= //')"
            echo "date   = $(date -u +%FT%TZ)"
            echo "runner = $RUNNER_NAME"
          } > logs/00-identity.txt
          cat logs/00-identity.txt
          exit 0

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cf-wa350-prs-${{ inputs.asset_profile }}-${{ github.run_number }}
          path: |
            logs/
            bin/targets/ath79/generic/*cf-wa350*
          retention-days: 30
