name: build-cf-wa350-v2

on:
  workflow_dispatch:
    inputs:
      openwrt_commit:
        description: Exact SHA to build from haddad2inc/openwrt (hard-verified)
        required: false
        default: 3ecebea4349ae036a23bcc79dd291f25f0a1cd87
        type: string
      dts_file:
        description: DTS variant from root dts/ folder on ci-wa350
        required: false
        default: qca9563_comfast_cf-wa350.dts
        type: choice
        options:
          - qca9563_comfast_cf-wa350.dts
          - qca9563_comfast_cf-wa350-internal-mdio.dts
          - qca9563_comfast_cf-wa350-explicit-mdio.dts
          - qca9563_comfast_cf-wa350-external.dts

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout pinned commit
        uses: actions/checkout@v4
        with:
          repository: haddad2inc/openwrt
          ref: ${{ inputs.openwrt_commit }}
          fetch-depth: 1

      - name: Verify HEAD equals requested SHA
        run: |
          set +e
          H="$(git rev-parse HEAD)"
          echo "HEAD = $H ; requested = ${{ inputs.openwrt_commit }}"
          case "$H" in
            ${{ inputs.openwrt_commit }}*) echo OK ;;
            *) echo "::error::HEAD mismatch"; exit 1 ;;
          esac
          exit 0

      - name: Pull root assets from ci-wa350
        run: |
          set +e
          git fetch --depth 1 origin ci-wa350 || exit 1
          mkdir -p logs /tmp/assets
          for f in "dts/${{ inputs.dts_file }}" ".config" \
                   "patches/731-ar8216-skip-phys-on-switch-internal-mdio-bus.patch" \
                   "patches/740-mtd-spi-nor-macronix-restore-mx25l12805d-name.patch"; do
            git show "origin/ci-wa350:$f" > "/tmp/assets/$(basename "$f")" || exit 1
          done
          sha256sum /tmp/assets/* | tee logs/assets.sha256
          exit 0

      - name: Inject DTS + classify variant + sha gate
        run: |
          set +e
          D=target/linux/ath79/dts/qca9563_comfast_cf-wa350.dts
          cp "/tmp/assets/${{ inputs.dts_file }}" "$D"
          S="$(sha256sum "$D" | cut -d' ' -f1)"
          PH="$(grep -c 'phy-handle *=' "$D")"; IN="$(grep -cE '^[[:space:]]+phy-mode = "internal";' "$D")"; MD="$(grep -cE '^[[:space:]]+mdio \{' "$D")"
          case "${{ inputs.dts_file }}" in
            *external*) V=EXTERNAL-MDIO;     E=c7cd13705d797229600a2d85f180fdb6736f39b493a7205c0211c746aaf015ca ;;
            *explicit*) V=INTERNAL-EXPLICIT; E=a755306340109abe2c63c47adb4144131011e12913f7ee3781c095be1dbe637e ;;
            *)          V=INTERNAL-LEGACY;   E=1544a5482fabf497479b6acb6d21ec68ab450a7f253239b84ff61fd843c9bb30 ;;
          esac
          { echo "variant    = $V"; echo "dts_file   = ${{ inputs.dts_file }}"; echo "dts_sha256 = $S"; echo "counters   = phy-handle:$PH internal:$IN mdio-child:$MD"; } | tee logs/variant.txt
          [ "$S" = "$E" ] || { echo "::error::DTS sha mismatch"; exit 1; }
          echo "V=$V" >> "$GITHUB_ENV"
          exit 0

      - name: Patch policy per variant
        run: |
          set +e
          PD=target/linux/ath79/patches-6.18
          : > logs/patches-injected.txt
          case "$V" in
            EXTERNAL-MDIO)
              [ -s "$PD/730-ar8216-make-reg-access-atomic.patch" ] || { echo "::error::730 missing in tree"; exit 1; }
              echo "730 present in tree (not re-injected)" >> logs/patches-injected.txt ;;
            INTERNAL-LEGACY)
              cp /tmp/assets/731-*.patch "$PD/" && echo "731 injected (regression witness; legacy needs no guard)" >> logs/patches-injected.txt ;;
            INTERNAL-EXPLICIT)
              cp /tmp/assets/731-*.patch "$PD/" && echo "731 injected (required)" >> logs/patches-injected.txt
              if ls target/linux/generic/backport-6.18/439-* >/dev/null 2>&1; then
                echo "740 SKIPPED: base carries 439 (duplicate would break refresh)" >> logs/patches-injected.txt
              else
                cp /tmp/assets/740-*.patch "$PD/" && echo "740 injected (base lacks 439)" >> logs/patches-injected.txt
              fi ;;
          esac
          cat logs/patches-injected.txt
          exit 0

      - name: Config from root .config + defconfig + proofs
        run: |
          set +e
          cp /tmp/assets/.config .config
          ./scripts/feeds update -a >/dev/null 2>&1
          ./scripts/feeds install -a >/dev/null 2>&1
          make defconfig || exit 1
          grep -E '^CONFIG_TARGET_PROFILE=|^CONFIG_PACKAGE_kmod-dsa-qca8k=|^CONFIG_TARGET_ROOTFS_INITRAMFS=|^CONFIG_GCC_VERSION=' .config | tee logs/config-proof.txt
          exit 0

      - name: Build (sysupgrade + initramfs)
        run: |
          set +e
          make -j"$(nproc)" V=s 2>&1 | tee logs/build.log
          rc=${PIPESTATUS[0]}
          ls -l bin/targets/ath79/generic/ | tee logs/bin-list.txt
          sha256sum bin/targets/ath79/generic/*cf-wa350* 2>/dev/null | tee logs/images.sha256
          exit "$rc"

      - name: Identity card
        if: always()
        run: |
          set +e
          {
            echo "commit = ${{ inputs.openwrt_commit }}"
            cat logs/variant.txt 2>/dev/null
            sed 's/^/patch  = /' logs/patches-injected.txt 2>/dev/null
            echo "kernel = 6.18$(grep -m1 'LINUX_VERSION-6.18' target/linux/generic/kernel-6.18 2>/dev/null | sed 's/.*= //')"
            echo "date   = $(date -u +%FT%TZ)"
            echo "runner = $RUNNER_NAME"
          } > logs/00-identity.txt
          cat logs/00-identity.txt
          exit 0

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cf-wa350-v2-${{ inputs.dts_file }}-${{ github.run_number }}
          path: |
            logs/
            bin/targets/ath79/generic/*cf-wa350*
          retention-days: 30
